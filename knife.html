<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Knife Throw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Knife Throw: Messer in den rotierenden Stamm werfen, nicht auf ein steckendes Messer treffen.
   Maße und Tempo aus der Bildschirmaufnahme (1170 x 2532). */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: #1a2612;
  color: #fff;
  font-family: var(--font);
  font-weight: 800;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; z-index: 6;
}
.bar button, .best {
  background: rgba(8, 14, 6, 0.6);
  color: #fff4e6;
  border: 0; border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit; font-size: 14px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result {
  position: absolute; inset: 0; z-index: 7;
  background: rgba(6, 8, 4, 0.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(11vw, 52px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button { margin-top: 10px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<canvas id="cv"></canvas>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0 Pts</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>

<script>
(function () {
  // Welt in Pixeln der Aufnahme bei 585 x 1266.
  // Stamm: Mitte (293 | 605), Radius 148. Messer unten: Spitze bei y 1015, 210 lang.
  // Gemessen: Drehung 150–230 °/s im Uhrzeigersinn, ändert sich weich alle paar Sekunden,
  // ab Stufe 2 auch mal Richtungswechsel (Umkehr über ca. 2 s). Neue Stufe startet wieder im Uhrzeigersinn.
  // Stufe 1: 5 Messer, 0 steckende, 1 Apfel · Stufe 2: 6 Messer, 1 steckendes, 1 Apfel · Stufe 3: 7 Messer, 2 steckende, 2 Äpfel.
  // Punkte: 1 pro Messer, Apfel +2.
  var WW = 585, WH = 1266, CX = 293, CY = 605, LR = 148, KL = 210, KTIP = 1015, EMBED = 100;
  var HIT_KNIFE = 11, HIT_APPLE = 10, FLIGHT_V = 3800;
  function stageCfg(n) {
    return {
      knives: Math.min(10, 4 + n),
      stuck: Math.min(6, n - 1),
      apples: n <= 2 ? 1 : Math.min(4, 1 + Math.floor((n - 1) / 2)),
      base: Math.min(300, 165 + 12 * (n - 1)),
      rev: n >= 2 ? 0.22 : 0
    };
  }

  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var bestEl = document.getElementById("best"), resultEl = document.getElementById("result");
  var Ws, Hs, dpr, k, ox, oy;
  function layout() {
    dpr = Math.min(3, window.devicePixelRatio || 1);
    Ws = window.innerWidth; Hs = window.innerHeight;
    cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr);
    k = Math.min(Ws / WW, Hs / WH);
    ox = (Ws - WW * k) / 2; oy = (Hs - WH * k) / 2;
  }
  window.addEventListener("resize", layout);
  layout();
  function X(x) { return ox + x * k; }
  function Y(y) { return oy + y * k; }

  var state = "idle", score = 0, best = 0, stage = 1, cfg = stageCfg(1);
  var rot = 0, w = 0, wt = 0, changeT = 0, left = 0, stuck = [], apples = [], flying = null, debris = [], pops = [];
  var clock = 0, clearT = 0, failT = 0, shake = 0, last = 0, gen = 0;
  try { best = parseInt(localStorage.getItem("knife-best"), 10) || 0; } catch (e) {}
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best : "--"); }
  showBest();

  function adiff(a, b) { var d = ((a - b) % 360 + 540) % 360 - 180; return Math.abs(d); }
  function freeAngle(taken, sep) {
    for (var t = 0; t < 200; t++) {
      var a = Math.random() * 360, ok = true;
      for (var i = 0; i < taken.length; i++) if (adiff(a, taken[i]) < sep) { ok = false; break; }
      if (ok) return a;
    }
    return Math.random() * 360;
  }
  function setupStage(n) {
    stage = n; cfg = stageCfg(n);
    stuck = []; apples = []; flying = null;
    var taken = [90];   // nicht direkt vor dem ersten Wurf
    for (var i = 0; i < cfg.stuck; i++) { var a = freeAngle(taken, 30); taken.push(a); stuck.push({ a: a, pre: true }); }
    for (var j = 0; j < cfg.apples; j++) { var b = freeAngle(taken, 28); taken.push(b); apples.push({ a: b }); }
    left = cfg.knives;
    w = cfg.base; wt = cfg.base; changeT = 1.2 + Math.random() * 1.6;
  }
  function idle() {
    gen++;
    state = "idle"; score = 0; rot = 0; debris = []; pops = []; shake = 0;
    resultEl.hidden = true;
    setupStage(1);
  }
  function throwKnife() {
    if (state === "idle") state = "run";
    if (state !== "run" || flying || left <= 0) return;
    left--;
    flying = { tipY: KTIP };
  }
  function stickOrFail() {
    var rel = ((90 - rot) % 360 + 360) % 360;
    for (var i = 0; i < stuck.length; i++) {
      if (adiff(rel, stuck[i].a) < HIT_KNIFE) {
        // Abpraller: Messer fliegt drehend weg, Lauf vorbei
        debris.push({ type: "knife", x: CX, y: CY + LR + 60, vx: (Math.random() < 0.5 ? -1 : 1) * 260, vy: 300, ang: 0, va: 9, t: clock });
        flying = null; state = "fail"; failT = clock; shake = 0.25;
        var rec = score > best;
        if (rec) { best = score; try { localStorage.setItem("knife-best", String(best)); } catch (e) {} showBest(); }
        document.getElementById("rec").hidden = !rec;
        var g = gen;
        setTimeout(function () { if (g !== gen) return; document.getElementById("pts").textContent = score + " Pts"; resultEl.hidden = false; state = "done"; }, 1000);
        return;
      }
    }
    stuck.push({ a: rel });
    score++;
    shake = 0.08;
    for (var j = apples.length - 1; j >= 0; j--) {
      if (adiff(rel, apples[j].a) < HIT_APPLE) {
        var wa = (apples[j].a + rot) * Math.PI / 180;
        var ax = CX + Math.cos(wa) * (LR + 18), ay = CY + Math.sin(wa) * (LR + 18);
        debris.push({ type: "apple", side: -1, x: ax, y: ay, vx: -120, vy: -120, ang: 0, va: -5, t: clock });
        debris.push({ type: "apple", side: 1, x: ax, y: ay, vx: 120, vy: -120, ang: 0, va: 5, t: clock });
        pops.push({ x: ax, y: ay, t: clock });
        apples.splice(j, 1);
        score += 2;
      }
    }
    flying = null;
    if (left === 0) { state = "clear"; clearT = clock; }
  }

  function step(dt) {
    clock += dt;
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (state === "run" || state === "idle" || state === "clear") {
      // Tempo ändert sich weich; ab Stufe 2 gelegentlich Umkehr
      changeT -= dt;
      if (changeT <= 0) {
        var mag = cfg.base + (Math.random() * 60 - 25), sgn = wt >= 0 ? 1 : -1;
        if (state === "run" && Math.random() < cfg.rev) sgn = -sgn;
        wt = sgn * mag;
        changeT = 1.2 + Math.random() * 1.6;
      }
      w += (wt - w) * (1 - Math.exp(-dt / 0.7));
      rot = (rot + w * dt) % 360;
    }
    if (flying) {
      flying.tipY -= FLIGHT_V * dt;
      if (flying.tipY <= CY + LR - EMBED + 2) stickOrFail();
    }
    if (state === "clear" && clock - clearT > 1.05) { state = "run"; setupStage(stage + 1); }
    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i];
      d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.ang += d.va * dt;
      if (d.y > WH + 300) debris.splice(i, 1);
    }
  }

  // Zeichnen
  function bg() {
    var g = ctx.createRadialGradient(Ws / 2, Y(560), 10, Ws / 2, Y(560), Math.max(Ws, Hs) * 0.75);
    g.addColorStop(0, "#6f9a45"); g.addColorStop(0.35, "#3f6a2c"); g.addColorStop(0.7, "#22381a"); g.addColorStop(1, "#131d0c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, Ws, Hs);
    // heller Waldboden
    var e = ctx.createRadialGradient(Ws / 2, Y(1040), 10, Ws / 2, Y(1040), 330 * k);
    e.addColorStop(0, "rgba(232, 176, 120, 0.55)"); e.addColorStop(1, "rgba(232, 176, 120, 0)");
    ctx.save(); ctx.translate(Ws / 2, Y(1040)); ctx.scale(1, 0.22); ctx.translate(-Ws / 2, -Y(1040));
    ctx.fillStyle = e; ctx.beginPath(); ctx.arc(Ws / 2, Y(1040), 330 * k, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function knife(x, y, ang, s, alpha) {
    // gezeichnet mit Spitze bei (0,0), Griff nach unten (+y)
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s * k, s * k); ctx.globalAlpha = alpha == null ? 1 : alpha;
    var bl = ctx.createLinearGradient(-20, 0, 20, 0);
    bl.addColorStop(0, "#8d8e96"); bl.addColorStop(0.5, "#f4f4f6"); bl.addColorStop(1, "#7c7d86");
    ctx.fillStyle = bl; ctx.strokeStyle = "#2a2a2e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(19, 40, 16, 98); ctx.lineTo(-16, 98); ctx.quadraticCurveTo(-19, 40, 0, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(60, 60, 70, 0.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, 92); ctx.stroke();
    ctx.fillStyle = "#c9ccd3"; ctx.strokeStyle = "#2a2a2e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-23, 98, 46, 10, 4) : ctx.rect(-23, 98, 46, 10); ctx.fill(); ctx.stroke();
    var hd = ctx.createLinearGradient(-14, 0, 14, 0);
    hd.addColorStop(0, "#7a2e10"); hd.addColorStop(0.45, "#c8551d"); hd.addColorStop(1, "#6a260c");
    ctx.fillStyle = hd; ctx.fillRect(-14, 108, 28, 92); ctx.strokeRect(-14, 108, 28, 92);
    ctx.fillStyle = "#c9ccd3"; ctx.fillRect(-16, 118, 32, 7); ctx.strokeRect(-16, 118, 32, 7);
    ctx.fillRect(-16, 186, 32, 8); ctx.strokeRect(-16, 186, 32, 8);
    ctx.beginPath(); ctx.ellipse(0, 202, 16, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function log() {
    var x = X(CX), y = Y(CY), r = LR * k;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180);
    // Rinde: Ring aus Klötzchen
    ctx.fillStyle = "#4a1708"; ctx.beginPath(); ctx.arc(0, 0, r + 3 * k, 0, Math.PI * 2); ctx.fill();
    var n = 34;
    for (var i = 0; i < n; i++) {
      var a0 = i / n * Math.PI * 2 + 0.02, a1 = (i + 1) / n * Math.PI * 2 - 0.02;
      ctx.fillStyle = i % 2 ? "#d9502a" : "#c9431f";
      ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.arc(0, 0, r * 0.86, a1, a0, true); ctx.closePath(); ctx.fill();
    }
    var wood = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.86);
    wood.addColorStop(0, "#ff9d2a"); wood.addColorStop(0.35, "#f0a43a"); wood.addColorStop(0.75, "#f6c35a"); wood.addColorStop(1, "#eeb24a");
    ctx.fillStyle = wood; ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#5a1a0b"; ctx.lineWidth = 3 * k; ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "rgba(170, 78, 20, 0.75)"; ctx.lineWidth = 2.5 * k;
    [0.12, 0.25, 0.4, 0.55, 0.7].forEach(function (f, i) { ctx.beginPath(); ctx.arc(0, 0, r * f, 0.3 * i, Math.PI * 2 + 0.3 * i - 0.25); ctx.stroke(); });
    ctx.lineWidth = 2 * k;
    [0.2, 1.3, 2.2, 3.4, 4.3, 5.4].forEach(function (a, i) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * (0.2 + 0.08 * (i % 3)), Math.sin(a) * r * (0.2 + 0.08 * (i % 3))); ctx.lineTo(Math.cos(a + 0.05) * r * 0.84, Math.sin(a + 0.05) * r * 0.84); ctx.stroke(); });
    ctx.restore();
  }
  function apple(x, y, ang, half) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(k, k);
    if (half) { ctx.beginPath(); ctx.rect(half < 0 ? -30 : 0, -30, 30, 60); ctx.clip(); }
    ctx.fillStyle = "#d4161c"; ctx.beginPath(); ctx.arc(-7, 2, 15, 0, Math.PI * 2); ctx.arc(7, 2, 15, 0, Math.PI * 2); ctx.fill();
    if (half) { ctx.fillStyle = "#fbe3c2"; ctx.beginPath(); ctx.ellipse(0, 2, 6, 14, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "rgba(255, 255, 255, 0.45)"; ctx.beginPath(); ctx.ellipse(-10, -4, 4, 6, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#5a3215"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(2, -18); ctx.stroke();
    ctx.fillStyle = "#3fa53a"; ctx.beginPath(); ctx.ellipse(9, -17, 9, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg();
    var sx = shake > 0 ? (Math.random() - 0.5) * 10 * k : 0, sy = shake > 0 ? (Math.random() - 0.5) * 10 * k : 0;
    ctx.save(); ctx.translate(sx, sy);
    var clearing = state === "clear" ? Math.max(0, (clock - clearT - 0.2) / 0.35) : 0;
    // steckende Messer (Klinge im Stamm verdeckt)
    stuck.forEach(function (s) {
      var wa = (s.a + rot) * Math.PI / 180, out = clearing * 260;
      var tr = LR - EMBED + out, tx = CX + Math.cos(wa) * tr, ty = CY + Math.sin(wa) * tr;
      if (clearing < 1) knife(X(tx), Y(ty), wa - Math.PI / 2, 1, 1 - clearing);
    });
    if (!(state === "clear" && clock - clearT > 0.55 && clock - clearT < 0.75)) log();
    apples.forEach(function (a) {
      var wa = (a.a + rot) * Math.PI / 180;
      apple(X(CX + Math.cos(wa) * (LR + 18)), Y(CY + Math.sin(wa) * (LR + 18)), wa + Math.PI / 2, 0);
    });
    if (flying) knife(X(CX), Y(flying.tipY), 0, 1);
    debris.forEach(function (d) {
      if (d.type === "knife") knife(X(d.x), Y(d.y), d.ang, 1);
      else apple(X(d.x), Y(d.y), d.ang, d.side);
    });
    pops.forEach(function (p) {
      var a = clock - p.t; if (a > 0.7) return;
      ctx.globalAlpha = 1 - a / 0.7; ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(28 * k) + "px " + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = "center"; ctx.fillText("+2", X(p.x), Y(p.y - 40 * a)); ctx.globalAlpha = 1;
    });
    ctx.restore();
    // Messer unten + Vorrat
    var ready = (state === "run" || state === "idle") && !flying && left > 0;
    if (ready) knife(X(CX), Y(KTIP), 0, 1);
    var spare = state === "clear" ? 0 : Math.max(0, left - 1);
    for (var i = 0; i < spare; i++) knife(X(CX + 46 + i * 31), Y(1015 + 4), 0, 0.6, 0.75);
    // Punkte
    ctx.font = "800 " + Math.round(80 * k) + "px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = state === "idle" ? "rgba(255, 255, 255, 0.35)" : "#fff";
    ctx.fillText(String(score), X(CX), Y(380));
    if (state === "idle") {
      ctx.fillStyle = "rgba(6, 10, 4, 0.55)"; ctx.fillRect(0, Y(300), Ws, Hs);
      ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(34 * k) + "px " + getComputedStyle(document.body).fontFamily;
      ctx.fillText("Tippen zum", X(CX), Y(765)); ctx.fillText("Werfen", X(CX), Y(805));
    }
    if (state === "fail" || state === "done") { ctx.fillStyle = "rgba(160, 20, 20, " + Math.max(0, 0.3 - (clock - failT) * 0.5).toFixed(3) + ")"; ctx.fillRect(0, 0, Ws, Hs); }
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    var n = Math.max(1, Math.ceil(dt / (1 / 240)));
    for (var i = 0; i < n; i++) step(dt / n);
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest("#trx"))) return;
    e.preventDefault();
    throwKnife();
  });
  document.addEventListener("keydown", function (e) { if (e.code === "Space") { e.preventDefault(); throwKnife(); } });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("ok"), idle);

  idle();
  requestAnimationFrame(function (t) { last = t; frame(t); });
  window.__knife = {
    get s() { return { state: state, score: score, stage: stage, left: left, rot: rot, w: w, stuck: stuck.map(function (s) { return s.a; }), apples: apples.map(function (a) { return a.a; }), flying: !!flying }; }
  };
})();
</script>
<style>

#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}

#trx .row{display:flex;gap:10px}

</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
