<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Time's Up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Time's Up: Balken leert sich, verschwindet auf halber Strecke, tippen wenn er leer wäre. 3 Level.
   Maße und Farben aus der Bildschirmaufnahme (1170 x 2532). */
:root {
  --font: "Syne", "Arial Black", system-ui, sans-serif;
  --w: min(100vw, 46.2vh);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, #1b1a42 0%, #18193b 30%, #171932 55%, #111728 100%);
  background-color: #171932;
  color: #fff;
  font-family: var(--font);
  font-weight: 800;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.bar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
  z-index: 6;
}
.bar button, .best {
  background: rgba(8, 8, 26, 0.6);
  color: #fff4e6;
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.title {
  position: absolute; left: 0; right: 0; top: 32.4%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.055);
  letter-spacing: 0.09em;
  color: #d9d9e3;
  text-transform: uppercase;
  pointer-events: none;
}
.track {
  position: absolute;
  left: 50%; top: 42.9%;
  width: calc(var(--w) * 0.306);
  height: 38%;
  transform: translateX(-50%);
  border-radius: calc(var(--w) * 0.065);
  background: linear-gradient(180deg, #273653 0%, #222b48 100%);
  overflow: hidden;
  pointer-events: none;
}
.track i {
  position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
  border-radius: calc(var(--w) * 0.065);
  background: linear-gradient(180deg, #0ca8d1 0%, #3178f2 100%);
}
.screen { position: absolute; inset: 0; pointer-events: none; display: none; }
.screen.on { display: block; }
.screen .btn { pointer-events: auto; }
.lbl2 { position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%); }
.miss { top: 48.8%; font: 600 calc(var(--w) * 0.044) system-ui, -apple-system, sans-serif; color: #9b9bab; }
.big { top: 55.3%; font-size: calc(var(--w) * 0.21); line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.verdict { top: 61.5%; font-size: calc(var(--w) * 0.05); }
.btn {
  position: absolute; left: 50%; top: 71.4%;
  transform: translate(-50%, -50%);
  width: calc(var(--w) * 0.79);
  height: calc(var(--w) * 0.205);
  border: 0; border-radius: 999px;
  background: linear-gradient(90deg, #0ca8d1 0%, #2f78f2 100%);
  box-shadow: 0 0 calc(var(--w) * 0.06) rgba(20, 160, 230, 0.35);
  color: #fff;
  font: inherit;
  font-size: calc(var(--w) * 0.05);
  line-height: 1.12;
  text-transform: uppercase;
  cursor: pointer;
}
.btn:active { transform: translate(-50%, -50%) scale(0.97); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.rows { position: absolute; left: 50%; top: 50.5%; width: calc(var(--w) * 0.51); transform: translate(-50%, -50%); }
.rows div { display: flex; justify-content: space-between; font: 600 calc(var(--w) * 0.044) system-ui, -apple-system, sans-serif; color: #d0d0da; line-height: 1.6; }
.rows div b { font-family: var(--font); font-weight: 800; font-variant-numeric: tabular-nums; }
.rule { position: absolute; left: 50%; top: 60.8%; width: calc(var(--w) * 0.51); height: 2px; transform: translateX(-50%); background: #3c3e56; }
.avgl { top: 64.5%; font: 600 calc(var(--w) * 0.044) system-ui, -apple-system, sans-serif; color: #c8c8d4; }
.avg { top: 71.2%; font-size: calc(var(--w) * 0.19); line-height: 1; color: #06add0; font-variant-numeric: tabular-nums; }
.rec { top: 78.2%; font-size: 14px; letter-spacing: 0.08em; color: #ffd34d; text-transform: uppercase; }
.rec[hidden] { display: none; }
.endbtn { top: 86%; }
.dim { position: absolute; inset: 0; background: rgba(10, 10, 20, 0.86); z-index: 4; display: none; pointer-events: none; }
.idle .dim { display: block; }
.hint { position: absolute; left: 0; right: 0; top: 60%; transform: translateY(-50%); text-align: center; font-size: calc(var(--w) * 0.07); line-height: 1.1; z-index: 5; display: none; pointer-events: none; }
.idle .hint { display: block; }
</style>

<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="title" id="title">Tippe wenn fertig</div>
<div class="track" id="track"><i id="fill"></i></div>

<div class="screen" id="res">
  <div class="lbl2 miss">Du warst um … daneben</div>
  <div class="lbl2 big" id="err">0.00s</div>
  <div class="lbl2 verdict" id="verdict">Zu früh!</div>
  <button class="btn" id="next" type="button">Nächstes<br>Level</button>
</div>
<div class="screen" id="end">
  <div class="rows" id="rows"></div>
  <div class="rule"></div>
  <div class="lbl2 avgl">Durchschnitt</div>
  <div class="lbl2 avg" id="avg">0.00s</div>
  <div class="lbl2 rec" id="rec" hidden>Neuer Rekord</div>
  <button class="btn endbtn" id="again" type="button">Nochmal</button>
</div>
<div class="dim"></div>
<div class="hint">Beobachte den<br>Balken. Tippe<br>wenn die Zeit<br>um ist!</div>

<script>
(function () {
  // Im Original gemessen: 12,6 s / 8,3 s / 6,45 s. Hier zufällig in einem Rahmen um diese Werte,
  // jedes Level kürzer als das vorige. Der Balken blendet ab 70 % Restfüllung aus und ist bei 47 % ganz weg.
  var RANGES = [[10, 15], [7, 10.5], [5, 8]], DUR = [12.6, 8.3, 6.45], FADE_FROM = 0.70, FADE_TO = 0.47;
  function rollDurations() {
    DUR = RANGES.map(function (r) { return Math.round((r[0] + Math.random() * (r[1] - r[0])) * 100) / 100; });
  }
  var COLORS = { good: "#1ebe53", mid: "#f3930d", bad: "#e64040" };
  function colorFor(e) { return e < 0.3 ? COLORS.good : e < 1 ? COLORS.mid : COLORS.bad; }

  var titleEl = document.getElementById("title"), track = document.getElementById("track"), fill = document.getElementById("fill");
  var res = document.getElementById("res"), end = document.getElementById("end");
  var errEl = document.getElementById("err"), verdict = document.getElementById("verdict");
  var bestEl = document.getElementById("best");

  var state = "idle", level = 0, t0 = 0, errs = [], best = 0;
  try { best = parseFloat(localStorage.getItem("timesup-best")) || 0; } catch (e) {}
  function fmt(x) { return x.toFixed(2) + "s"; }
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? fmt(best) : "--"); }
  showBest();

  function setBar(rem) {
    var a = rem >= FADE_FROM ? 1 : rem <= FADE_TO ? 0 : (rem - FADE_TO) / (FADE_FROM - FADE_TO);
    fill.style.height = Math.max(0, rem) * 100 + "%";
    track.style.opacity = a;
  }
  function idle() {
    state = "idle"; level = 0; errs = [];
    rollDurations();
    res.classList.remove("on"); end.classList.remove("on");
    titleEl.textContent = "Tippe wenn fertig";
    track.style.display = ""; setBar(1);
    document.body.classList.add("idle");
  }
  function startLevel() {
    state = "run";
    document.body.classList.remove("idle");
    res.classList.remove("on");
    titleEl.textContent = "Tippe wenn fertig";
    track.style.display = "";
    setBar(1);
    t0 = performance.now();
  }
  function tap() {
    if (state === "idle") { startLevel(); return; }
    if (state !== "run") return;
    var t = (performance.now() - t0) / 1000, d = t - DUR[level];
    finishLevel(d);
  }
  function finishLevel(d) {
    var e = Math.abs(d);
    errs.push(e);
    state = "result";
    track.style.display = "none";
    errEl.textContent = fmt(e);
    var c = colorFor(e);
    errEl.style.color = c; verdict.style.color = c;
    verdict.textContent = e < 0.005 ? "Perfekt!" : d < 0 ? "Zu früh!" : "Zu spät!";
    titleEl.textContent = "Level " + (level + 1) + " von 3";
    document.getElementById("next").innerHTML = level < 2 ? "Nächstes<br>Level" : "Ergebnis";
    res.classList.add("on");
  }
  function next() {
    if (state !== "result") return;
    if (level < 2) { level++; startLevel(); return; }
    showEnd();
  }
  function showEnd() {
    state = "end";
    res.classList.remove("on");
    titleEl.textContent = "Endergebnisse";
    var rows = document.getElementById("rows");
    rows.innerHTML = errs.map(function (e, i) { return '<div><span>Level ' + (i + 1) + ':</span><b style="color:' + colorFor(e) + '">' + fmt(e) + "</b></div>"; }).join("");
    var avg = (errs[0] + errs[1] + errs[2]) / 3;
    avg = Math.round(avg * 100) / 100;
    document.getElementById("avg").textContent = fmt(avg);
    var rec = !best || avg < best;
    if (rec) { best = avg; try { localStorage.setItem("timesup-best", String(best)); } catch (e) {} showBest(); }
    document.getElementById("rec").hidden = !rec;
    end.classList.add("on");
  }

  function frame() {
    if (state === "run") {
      var t = (performance.now() - t0) / 1000, D = DUR[level];
      setBar(1 - t / D);
      if (t > D * 2.5) finishLevel(t - D);   // nicht getippt: Level nach dem 2,5-fachen der Zeit werten
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest && (e.target.closest(".bar") || e.target.closest(".btn") || e.target.closest("#trx"))) return;
    e.preventDefault();
    tap();
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); if (state === "result") next(); else tap(); }
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("next"), next);
  bindTap(document.getElementById("again"), idle);

  idle();
  window.__tu = { get s() { return { state: state, level: level, errs: errs.slice(), dur: DUR.slice(), t: (performance.now() - t0) / 1000 }; } };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}
#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}
#trx h2{font:800 20px system-ui,-apple-system,sans-serif;margin:0}
#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}
#trx textarea{width:min(340px,90vw);height:110px;border-radius:12px;border:1px solid #555;background:#1b1b1f;color:#eee;font:12px ui-monospace,monospace;padding:10px;resize:none}
#trx .row{display:flex;gap:10px}
#trx button{border:0;border-radius:12px;padding:12px 18px;font:800 16px system-ui,-apple-system,sans-serif;cursor:pointer;background:#3a3a3c;color:#fff}
#trx button.main{background:#f5d55a;color:#111}
#trx button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
