<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Zahlenraster 9–16</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Layout: Timer bei ~31% Höhe, 4x4-Raster bei ~46%, Maße wie auf dem Foto. Bewusst nur dunkles Design. */
:root {
  --bg: #050505;
  --cream: #fff0b0;
  --pill: #fbb02d;
  --pill-ink: #3a2400;
  --font: "Syne", "Arial Black", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font);
  font-weight: 800;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.bar {
  position: absolute;
  top: 12px;
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
}
.bar button, .best {
  background: #1c1c1c;
  color: var(--cream);
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.range {
  position: absolute;
  top: 12px;
  left: max(16px, env(safe-area-inset-left, 0px));
  z-index: 10;
}
.range > button {
  background: #1c1c1c;
  color: var(--cream);
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.range > button svg { width: 12px; height: 12px; transition: transform 0.15s; }
.range.open > button svg { transform: rotate(180deg); }
.range > button:focus-visible, .menu button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  min-width: 150px;
  background: #1c1c1c;
  border-radius: 16px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  display: none;
}
.range.open .menu { display: grid; gap: 2px; }
.menu .grp { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; padding: 8px 10px 4px; }
.menu button {
  background: transparent;
  color: var(--cream);
  border: 0;
  border-radius: 10px;
  padding: 0.65em 0.8em;
  font: inherit;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.menu button.cur { background: var(--cream); color: #050505; }
.menu button small { font-size: 12px; opacity: 0.6; }
.splits {
  position: absolute;
  left: 0; right: 0;
  top: calc(29% + clamp(34px, 10.5vw, 60px) * 1.45);
  text-align: center;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
  white-space: nowrap;
}
.splits b { opacity: 0.55; margin-right: 0.25em; }
.splits span + span { margin-left: 0.9em; }
.timer.paused { opacity: 0.55; }
.timer {
  position: absolute;
  left: 0; right: 0;
  top: 29%;
  text-align: center;
  font-size: clamp(34px, 10.5vw, 60px);
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
.again {
  position: absolute;
  left: 50%;
  top: 21%;
  transform: translateX(-50%);
  background: var(--pill);
  color: var(--pill-ink);
  border: 0;
  border-radius: 999px;
  padding: 0.55em 1.3em;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.again:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
.again.rs { background: #1c1c1c; color: var(--cream); }
.again:active { transform: translateX(-50%) scale(0.94); }
.bar button.auto {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid var(--cream);
  border-radius: 7px;
  background: transparent;
  opacity: 0.55;
  margin-right: 4px;
}
.bar button.auto[aria-pressed="true"] { background: var(--cream); opacity: 1; }
.grid {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translateX(-50%);
  width: min(78vw, 420px, 52vh);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2.5%;
}
.tile {
  aspect-ratio: 1;
  border: 0;
  border-radius: 9%;
  padding: 0;
  font: inherit;
  font-size: clamp(22px, 7.6vw, 38px);
  color: var(--cream);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.06s, opacity 0.1s;
}
.tile:active { transform: scale(0.93); }
.tile.done { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

<div class="range" id="range">
  <button id="rangeBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="rangeLbl">9–16</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg></button>
  <div class="menu" id="menu" role="menu"></div>
</div>
<div class="bar">
  <button id="auto" class="auto" type="button" aria-pressed="false" aria-label="Nach dem Schaffen automatisch neu starten"></button>
  <div class="best" id="best">Best --</div>
</div>
<div class="timer" id="timer" aria-live="off">0.0s</div>
<div class="splits" id="splits"></div>
<button class="again rs" id="again" type="button">&#8635; Reset</button>
<div class="grid" id="grid"></div>

<script>
(function () {
  // Feste Anordnung wie auf dem Foto, Farben pro Kachel
  var layout = [
    [8, "#c9ea00"], [3, "#a4adff"], [12, "#ffa100"], [6, "#ff6a00"],
    [1, "#ff1530"], [10, "#ff3a08"], [2, "#c60fa4"], [11, "#b3b9e0"],
    [16, "#a3b800"], [15, "#ff2014"], [5, "#8ab52a"], [13, "#a31fb0"],
    [14, "#8d98ff"], [4, "#bcec9c"], [9, "#8c1ccc"], [7, "#ff1a14"]
  ];
  var grid = document.getElementById("grid");
  var timerEl = document.getElementById("timer");
  var againBtn = document.getElementById("again");
  var tiles = {};
  var bestEl = document.getElementById("best");
  var autoBtn = document.getElementById("auto");
  var auto = false;
  try { auto = localStorage.getItem("zr-auto") === "1"; } catch (e) {}
  autoBtn.setAttribute("aria-pressed", auto ? "true" : "false");
  autoBtn.addEventListener("click", function (e) {
    e.preventDefault();
    auto = !auto;
    autoBtn.setAttribute("aria-pressed", auto ? "true" : "false");
    try { localStorage.setItem("zr-auto", auto ? "1" : "0"); } catch (e2) {}
  });
  // Ein Button an der Stelle von "Nochmal": sonst "Reset", nach dem Schaffen "Nochmal"
  function setAgain(fin) {
    againBtn.classList.toggle("rs", !fin);
    againBtn.innerHTML = fin ? "Nochmal" : "&#8635; Reset";
  }
  // Abschnitte: ab FIRST tippen (kleinere Zahlen gelten als schon gelöst), Zeit stoppt bei LAST
  // [erste, letzte, Viertel-mit-Pause]
  var RANGES = [[1, 8], [9, 16], [1, 4], [5, 8], [9, 12], [13, 16], [1, 16, true]];
  var FIRST = 9, LAST = 16, QUART = false;
  function rangeId(r) { return r[0] + "-" + r[1] + (r[2] ? "-q" : ""); }
  try {
    var saved = localStorage.getItem("zr-range") || "";
    RANGES.forEach(function (r) { if (rangeId(r) === saved) { FIRST = r[0]; LAST = r[1]; QUART = !!r[2]; } });
  } catch (e) {}
  var splitsEl = document.getElementById("splits");
  var elapsed = 0, segStart = 0, splits = [];
  // Viertel-Modus: Zeit pausiert nach 4, 8, 12 und läuft weiter beim Tippen von 5, 9, 13
  function isSegStart(n) { return n === FIRST || (QUART && (n - 1) % 4 === 0); }
  function isSegEnd(n) { return n === LAST || (QUART && n % 4 === 0); }
  function drawSplits() {
    if (!QUART) { splitsEl.innerHTML = ""; return; }
    splitsEl.innerHTML = splits.map(function (t, i) { return "<span><b>V" + (i + 1) + "</b>" + (t / 1000).toFixed(2) + "</span>"; }).join("");
  }
  var next = FIRST, start = 0, raf = 0, running = false, best = null;
  function bestKey() { return "zr-best-" + FIRST + "-" + LAST + (QUART ? "-q" : ""); }
  function loadBest() {
    best = null;
    try { var s = parseFloat(localStorage.getItem(bestKey())); if (s > 0) best = s; } catch (e) {}
    // alte 9-16-Bestzeit übernehmen
    if (!best && FIRST === 9 && LAST === 16 && !QUART) { try { var o = parseFloat(localStorage.getItem("zr9-best")); if (o > 0) best = o; } catch (e) {} }
  }
  loadBest();
  function showBest() { bestEl.textContent = "Best " + (best ? (best / 1000).toFixed(2) + "s" : "--"); }
  showBest();

  layout.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tile";
    b.textContent = t[0];
    b.style.background = t[1];
    b.setAttribute("aria-label", String(t[0]));
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); tap(t[0]); });
    grid.appendChild(b);
    tiles[t[0]] = b;
  });

  function fmt(ms, d) { return (ms / 1000).toFixed(d) + "s"; }
  function tick() {
    timerEl.textContent = fmt(elapsed + (performance.now() - segStart), 1);
    raf = requestAnimationFrame(tick);
  }
  function tap(n) {
    if (n !== next) return;
    var now = performance.now();
    if (!running && isSegStart(n)) {
      if (n === FIRST) drawSplits();
      segStart = now;
      running = true;
      timerEl.classList.remove("paused");
      raf = requestAnimationFrame(tick);
    }
    tiles[n].classList.add("done");
    next++;
    if (running && isSegEnd(n)) {
      cancelAnimationFrame(raf);
      running = false;
      var seg = now - segStart;
      elapsed += seg;
      if (QUART) { splits.push(seg); drawSplits(); }
      timerEl.textContent = fmt(elapsed, 2);
      if (n !== LAST) timerEl.classList.add("paused");
    }
    if (n === LAST) {
      var t = elapsed;
      timerEl.textContent = fmt(t, 2);
      setAgain(true);
      if (!best || t < best) {
        best = t;
        try { localStorage.setItem(bestKey(), String(t)); } catch (e) {}
        showBest();
      }
      if (auto) reset(true);
    }
  }
  function reset(keep) {
    cancelAnimationFrame(raf);
    running = false;
    next = FIRST;
    elapsed = 0; splits = [];
    timerEl.classList.remove("paused");
    if (!keep) { drawSplits(); timerEl.textContent = "0.0s"; }
    setAgain(false);
    Object.keys(tiles).forEach(function (k) {
      var gone = Number(k) < FIRST;
      tiles[k].classList.toggle("done", gone);
      tiles[k].tabIndex = gone ? -1 : 0;
    });
  }
  againBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); reset(); });
  againBtn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reset(); } });
  timerEl.addEventListener("pointerdown", function () { if (!running) reset(); });

  // Auswahl-Menü oben links
  var rangeEl = document.getElementById("range");
  var rangeBtn = document.getElementById("rangeBtn");
  var rangeLbl = document.getElementById("rangeLbl");
  var menu = document.getElementById("menu");
  function label(r, short) { return r[2] ? (short ? "4 Viertel" : "Viertel mit Pause") : r[0] + "–" + r[1]; }
  function buildMenu() {
    menu.innerHTML = "";
    [["Hälften", RANGES.slice(0, 2)], ["Viertel", RANGES.slice(2, 6)], ["Ganz, mit Pausen", RANGES.slice(6)]].forEach(function (g) {
      var h = document.createElement("div"); h.className = "grp"; h.textContent = g[0]; menu.appendChild(h);
      g[1].forEach(function (r) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitem");
        var cur = r[0] === FIRST && r[1] === LAST && !!r[2] === QUART;
        if (cur) b.className = "cur";
        b.innerHTML = "<span>" + label(r) + "</span>" + (cur ? "<small>aktiv</small>" : "");
        b.addEventListener("click", function (e) { e.stopPropagation(); choose(r); });
        menu.appendChild(b);
      });
    });
  }
  function setOpen(o) { rangeEl.classList.toggle("open", o); rangeBtn.setAttribute("aria-expanded", o ? "true" : "false"); }
  function choose(r) {
    FIRST = r[0]; LAST = r[1]; QUART = !!r[2];
    try { localStorage.setItem("zr-range", rangeId(r)); } catch (e) {}
    rangeLbl.textContent = label(r, true);
    loadBest(); showBest();
    buildMenu();
    setOpen(false);
    reset();
  }
  rangeBtn.addEventListener("click", function (e) { e.stopPropagation(); setOpen(!rangeEl.classList.contains("open")); });
  document.addEventListener("click", function (e) { if (!rangeEl.contains(e.target)) setOpen(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
  rangeLbl.textContent = label([FIRST, LAST, QUART], true);
  buildMenu();
  reset();
})();
</script>

</body></html>
