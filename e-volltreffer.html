<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; --bg: #14151b; --panel: #252733; --acc: #8b7bff; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: #fff; font-family: var(--font); font-weight: 800; position: relative; overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.bar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; z-index: 6; }
.bar button, .best { background: rgba(255, 255, 255, 0.09); color: #fff4e6; border: 0; border-radius: 999px; padding: 0.5em 0.95em; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.hud { position: absolute; left: 0; right: 0; top: calc(60px + env(safe-area-inset-top, 0px)); text-align: center; z-index: 2; pointer-events: none; }
#score { font-size: min(15vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
#sub { height: 22px; margin-top: 8px; font-size: 15px; letter-spacing: 0.05em; color: rgba(255, 255, 255, 0.72); }
#sub .h { color: rgba(255, 255, 255, 0.18); font-size: 20px; margin: 0 2px; }
#sub .h.on { color: #ff5068; }
#tbar { position: absolute; left: 14%; right: 14%; top: calc(156px + env(safe-area-inset-top, 0px)); height: 8px; border-radius: 4px; background: #2c2e3a; overflow: hidden; z-index: 2; }
#tbar i { display: block; height: 100%; width: 100%; background: var(--acc); transform-origin: left center; }
#tbar.low i { background: #ff5068; }
#game { position: absolute; left: 0; right: 0; top: calc(176px + env(safe-area-inset-top, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1; }
#game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#flash { position: absolute; inset: 0; background: #ff3050; opacity: 0; pointer-events: none; z-index: 3; transition: opacity 0.45s ease-out; }
#flash.on { opacity: 0.3; transition: none; }
.intro { position: absolute; inset: 0; z-index: 4; background: rgba(10, 11, 16, 0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 9vw; text-align: center; cursor: pointer; }
.intro p { font-size: min(6.4vw, 26px); line-height: 1.22; margin: 0 0 30px; white-space: pre-line; }
.intro small { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.6; margin-top: 18px; }
.pulse { width: 46px; height: 46px; border-radius: 50%; background: var(--acc); animation: pu 1.1s ease-in-out infinite; }
@keyframes pu { 0%, 100% { transform: scale(0.75); opacity: 0.55; } 50% { transform: scale(1); opacity: 1; } }
.result { position: absolute; inset: 0; z-index: 7; background: rgba(8, 8, 14, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 8vw; }
.result[hidden], .rec[hidden], .intro[hidden], #tbar[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(13vw, 56px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.detail { font: 600 14px system-ui, -apple-system, sans-serif; opacity: 0.7; line-height: 1.4; min-height: 1.4em; white-space: pre-line; }
.result button { margin-top: 10px; background: var(--acc); color: #0c0c12; border: 0; border-radius: 12px; padding: 0.65em 1.6em; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<div id="flash"></div>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="hud"><div id="score">0</div><div id="sub"></div></div>
<div id="tbar" hidden><i></i></div>
<div id="game"></div>
<div class="intro" id="intro"><p id="intro-t"></p><div class="pulse"></div><small>Tippen zum Start</small></div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <div class="detail" id="detail"></div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>
<script>
/* Gemeinsames Gerüst der eigenen Spiele: Reset/Best oben rechts, Punkte, Leben, Zeitbalken, Start-Hinweis, Ergebnis, Töne.
   Jedes Spiel ruft Kit.init({ key, intro, reset, start, fmt, lower }) auf und meldet das Ende mit Kit.over(wert). */
var Kit = (function () {
  var o, best = null, gen = 0, ac = null;
  function $(id) { return document.getElementById(id); }
  function load() { try { var v = localStorage.getItem(o.key); best = v === null ? null : parseFloat(v); if (isNaN(best)) best = null; } catch (e) { best = null; } }
  function showBest() { $("best").innerHTML = "<b>Best</b>" + (best === null ? "--" : o.fmt(best)); }
  function tap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(e); }); }
  function audio() { try { if (!ac) { var A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } if (ac && ac.state === "suspended") ac.resume(); } catch (e) {} }
  function tone(freq, dur, vol, type) {
    if (!ac) return;
    try {
      var t = ac.currentTime, os = ac.createOscillator(), g = ac.createGain();
      os.type = type || "sine"; os.frequency.value = freq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
      os.connect(g); g.connect(ac.destination); os.start(t); os.stop(t + (dur || 0.15) + 0.02);
    } catch (e) {}
  }
  function reset() {
    gen++; $("result").hidden = true; $("intro").hidden = false; $("intro-t").textContent = o.intro || "";
    score(0); sub(""); bar(-1); o.reset();
  }
  function init(opts) {
    o = opts; if (!o.fmt) o.fmt = function (v) { return String(v); };
    load(); showBest();
    tap($("reset"), reset); tap($("ok"), reset);
    $("intro").addEventListener("pointerdown", function (e) { e.preventDefault(); e.stopPropagation(); $("intro").hidden = true; audio(); o.start(e); });
    window.addEventListener("resize", function () { if (o.resize) o.resize(); });
    reset();
  }
  // Ende eines Laufs. val = null heißt: kein gültiges Ergebnis.
  function over(val, detail, delay) {
    var g = gen, rec = false, has = val !== null && val !== undefined;
    if (has) { rec = best === null || (o.lower ? val < best : val > best); if (rec) { best = val; try { localStorage.setItem(o.key, String(val)); } catch (e) {} showBest(); } }
    $("pts").textContent = has ? o.fmt(val) : "–"; $("rec").hidden = !rec; $("detail").textContent = detail || "";
    setTimeout(function () { if (g === gen) $("result").hidden = false; }, delay === undefined ? 750 : delay);
  }
  // wie setTimeout, läuft aber nach Reset nicht mehr
  function later(fn, ms) { var g = gen; return setTimeout(function () { if (g === gen) fn(); }, ms); }
  function score(v) { $("score").textContent = v; }
  function sub(html) { $("sub").innerHTML = html; }
  function lives(n, max) { var s = ""; for (var i = 0; i < max; i++) s += '<span class="h' + (i < n ? " on" : "") + '">&#9829;</span>'; sub(s); }
  function bar(f) { var b = $("tbar"); if (f < 0) { b.hidden = true; return; } b.hidden = false; f = Math.max(0, Math.min(1, f)); b.firstChild.style.transform = "scaleX(" + f + ")"; b.className = f < 0.25 ? "low" : ""; }
  function flash() { var f = $("flash"); f.classList.add("on"); void f.offsetWidth; f.classList.remove("on"); }
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms || 10); } catch (e) {} } }
  function good() { tone(880, 0.09, 0.08); }
  function bad() { tone(140, 0.3, 0.14, "sawtooth"); buzz(60); flash(); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function ui(e) { return !!(e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest(".intro") || e.target.closest("#trx"))); }
  // Zeichenfläche, die den Spielbereich füllt; c.W / c.H in CSS-Pixeln
  function canvas() {
    var cv = document.createElement("canvas"), c = { cv: cv, ctx: cv.getContext("2d"), W: 0, H: 0, dpr: 1 };
    $("game").appendChild(cv);
    c.fit = function () { c.dpr = Math.min(3, window.devicePixelRatio || 1); c.W = $("game").clientWidth; c.H = $("game").clientHeight; cv.width = Math.round(c.W * c.dpr); cv.height = Math.round(c.H * c.dpr); c.ctx.setTransform(c.dpr, 0, 0, c.dpr, 0, 0); };
    window.addEventListener("resize", c.fit); c.fit();
    return c;
  }
  function loop(fn) { var last = 0; function fr(t) { requestAnimationFrame(fr); var dt = Math.min(0.05, (t - last) / 1000); last = t; fn(dt, t); } requestAnimationFrame(function (t) { last = t; fr(t); }); }
  function font() { return getComputedStyle(document.body).fontFamily; }
  return { init: init, over: over, later: later, score: score, sub: sub, lives: lives, bar: bar, flash: flash, buzz: buzz, tone: tone, good: good, bad: bad,
    rnd: rnd, ri: ri, pick: pick, shuffle: shuffle, ui: ui, canvas: canvas, loop: loop, font: font, $: $, get best() { return best; } };
})();
</script>
<title>Volltreffer</title>
<style>
/* Volltreffer: Ein Punkt läuft auf dem Ring. Tippe, wenn er im farbigen Feld ist. Treffer +1, genau in der Mitte +2.
   Danach dreht er die Richtung, wird schneller (1,9 rad/s + 0,09 pro Punkt, max 5,5) und das Feld kleiner (halbe Breite 0,42 rad - 0,014 pro Punkt, min 0,13). 3 Leben. */
:root { --acc: #ff8a3d; }
</style>
<script>
(function () {
  var LIVES = 3, CORE = 0.3;
  function speed(s) { return Math.min(5.5, 1.9 + 0.09 * s); }
  function half(s) { return Math.max(0.13, 0.42 - 0.014 * s); }
  var c = Kit.canvas(), ctx = c.ctx, state, score, lives, a, dir, z, pops, hitT, missT;
  function norm(x) { x = (x + Math.PI) % (2 * Math.PI); if (x < 0) x += 2 * Math.PI; return x - Math.PI; }
  function newZone() { z = a + dir * Kit.rnd(1.4, 4.6); }
  function tap() {
    if (state !== "play") return;
    var d = Math.abs(norm(a - z)), hw = half(score);
    if (d <= hw) {
      var perfect = d <= hw * CORE, pts = perfect ? 2 : 1;
      score += pts; Kit.score(score); Kit.buzz(perfect ? 18 : 8); Kit.tone(perfect ? 1175 : 880, 0.1, 0.09);
      pops.push({ t: 0, txt: perfect ? "PERFEKT +2" : "+1", a: a }); hitT = 0.25;
      dir = -dir; newZone();
    } else {
      lives--; Kit.lives(lives, LIVES); Kit.bad(); missT = 0.3;
      if (lives <= 0) { state = "over"; Kit.over(score, "", 900); }
    }
  }
  function draw() {
    var W = c.W, H = c.H, cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.36, H * 0.4), th = R * 0.2, hw = half(score);
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "butt"; ctx.lineWidth = th; ctx.strokeStyle = missT > 0 ? "#5a2630" : "#252733";
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    if (state !== "idle") {
      ctx.strokeStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(cx, cy, R, z - hw, z + hw); ctx.stroke();
      ctx.strokeStyle = "#ffd9a8"; ctx.beginPath(); ctx.arc(cx, cy, R, z - hw * CORE, z + hw * CORE); ctx.stroke();
    }
    var px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px, py, th * (0.44 + (hitT > 0 ? 0.25 : 0)), 0, 7); ctx.fill();
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "800 " + Math.round(R * 0.17) + "px " + Kit.font();
    pops.forEach(function (p) { ctx.globalAlpha = Math.max(0, 1 - p.t / 0.7); ctx.fillStyle = "#fff"; ctx.fillText(p.txt, cx, cy - p.t * R * 0.25); ctx.globalAlpha = 1; });
  }
  Kit.loop(function (dt) {
    if (state === "play") a += dir * speed(score) * dt;
    hitT -= dt; missT -= dt;
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.7) pops.splice(i, 1); }
    draw();
  });
  document.addEventListener("pointerdown", function (e) { if (Kit.ui(e)) return; e.preventDefault(); tap(); });
  Kit.init({
    key: "e-volltreffer-best", intro: "Tippe, wenn der Punkt\nim farbigen Feld ist.\nGenau in der Mitte zählt doppelt.",
    reset: function () { state = "idle"; score = 0; lives = LIVES; a = -Math.PI / 2; dir = 1; z = 0; pops = []; hitT = 0; missT = 0; },
    start: function () { Kit.lives(lives, LIVES); newZone(); state = "play"; }
  });
  window.__g = { get s() { return { state: state, a: a, z: z, hw: half(score), score: score, lives: lives, d: Math.abs(norm(a - z)) }; }, tap: tap };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}

<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>
