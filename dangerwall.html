<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Dangerwall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Dangerwall: Box fliegt waagerecht zwischen zwei Wänden hin und her, Tippen = Sprung.
   Stacheln an den Wänden und die roten Linien oben/unten beenden den Lauf. Werte aus dem Video gemessen. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: #66398f;
  color: #fdf4ec;
  font-family: var(--font);
  font-weight: 800;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
  z-index: 6;
}
.bar button, .best {
  background: rgba(24, 8, 40, 0.6);
  color: #fff4e6;
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.hint {
  position: absolute;
  left: 0; right: 0;
  top: 52%;
  transform: translateY(-50%);
  text-align: center;
  font-size: min(6.2vw, 30px);
  line-height: 1.12;
  z-index: 5;
  pointer-events: none;
  color: #fff;
  display: none;
}
.idle .hint { display: block; }
.result {
  position: absolute;
  inset: 0;
  background: rgba(10, 6, 16, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  z-index: 7;
}
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(11vw, 52px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button {
  margin-top: 10px;
  background: #3a3a3c;
  color: #fff;
  border: 2px solid #8a8a8e;
  border-radius: 12px;
  padding: 0.65em 1.6em;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<canvas id="cv"></canvas>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="hint">Tippen zum<br>Springen.<br>Vermeide<br>Stacheln.</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0 Pts</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>

<script>
(function () {
  // Aus dem Video gemessen:
  // Sprung: Scheitel nach 0,5 s, ca. 12,5 % der Feldhöhe hoch -> g = 1,0 H/s², Sprung = 0,5 H/s.
  // Querflug von Wand zu Wand: 1 / (0,4145 + 0,0205 * Punkte) Sekunden (2,3 s am Anfang, 1,1 s bei 23).
  // Stacheln pro Wand: 1, ab 6 Punkten 2, ab 12 drei, ab 19 vier, danach alle 7 Punkte einer mehr.
  // Die Wand, die gerade getroffen wurde, bekommt neue Stacheln.
  var TOP = 0.2607, LINE = 3;               // rote Linie oben bei 26,1 % der Höhe, 3 px stark
  var GRAV = 1.0, JUMP = -0.50;             // in Feldhöhen (aus Bildschirmaufnahme: Scheitel nach 0,5 s, 12,5 % hoch)
  var BOX = 0.10;                           // Boxgröße in Feldbreiten
  var SPIKE_D = 0.08, SPIKE_H = 0.070;      // Stacheltiefe (Breite), Stachelhöhe (Feldhöhe)
  var HIT = 0.82;                           // Trefferfläche der Box (Anteil der sichtbaren Größe)
  var COL = { bgTop: "#5f3489", bgBot: "#7a479b", line: "#ff3c1a", spike: "#fc3c00", box: "#fdf4ec", trail: "214, 206, 255", dim: "rgba(26, 10, 36, 0.93)" };
  var STEPS = [6, 12, 20, 28, 37, 47];
  function spikesFor(s) { var n = 1; STEPS.forEach(function (t) { if (s >= t) n++; }); return n; }
  function crossTime(s) { return 1 / Math.min(0.94, 0.4145 + 0.0205 * s); }  // ab ca. 26 Punkten konstant ~1,06 s

  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var bestEl = document.getElementById("best"), resultEl = document.getElementById("result");
  var ptsEl = document.getElementById("pts"), recEl = document.getElementById("rec");

  var Ws, Hs, dpr, fTop, fH, boxS;
  function layout() {
    dpr = Math.min(3, window.devicePixelRatio || 1);
    Ws = window.innerWidth; Hs = window.innerHeight;
    cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr);
    fTop = Hs * TOP + LINE;
    fH = Hs - fTop - LINE;
    boxS = Ws * BOX;
  }
  window.addEventListener("resize", layout);
  layout();

  // Zustand in Bildschirmpixeln (x) und Feldhöhen (y)
  var state = "idle", score = 0, best = 0, gen = 0, last = 0, clock = 0;
  var bx = 0, by = 0, vy = 0, dir = 1, walls = { L: [], R: [] }, trail = [], trailT = 0;
  try { best = parseInt(localStorage.getItem("dangerwall-best"), 10) || 0; } catch (e) {}
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best : "--"); }
  showBest();
  function later(fn, ms) { var g = gen; setTimeout(function () { if (g === gen) fn(); }, ms); }

  function makeSpikes(n) {
    // zufällige Positionen ohne Überlappung, mit Abstand zu den Linien oben und unten
    var h = SPIKE_H, out = [], tries = 0;
    while (out.length < n && tries++ < 500) {
      var y = 0.05 + h / 2 + Math.random() * (0.78 - 0.05 - h);  // im Original nie im unteren Fünftel
      var ok = true;
      for (var i = 0; i < out.length; i++) if (Math.abs(out[i] - y) < h * 1.15) { ok = false; break; }
      if (ok) out.push(y);
    }
    return out.sort(function (a, b) { return a - b; });
  }
  function setWall(side, n, animate) {
    walls[side] = makeSpikes(n).map(function (y) { return { y: y, t0: animate ? clock : -1 }; });
  }
  function idle() {
    gen++;
    state = "idle"; score = 0; clock = 0;
    resultEl.hidden = true;
    bx = Ws / 2; by = 0.5; vy = 0; dir = 1; trail = [];
    setWall("L", 1, false); setWall("R", 1, false);
    document.body.classList.add("idle");
  }
  function jump() {
    if (state === "idle") { state = "run"; document.body.classList.remove("idle"); last = performance.now(); }
    if (state !== "run") return;
    vy = JUMP;
  }
  function die() {
    state = "dead";
    var rec = score > best;
    if (rec) {
      best = score;
      try { localStorage.setItem("dangerwall-best", String(best)); } catch (e) {}
      showBest();
    }
    recEl.hidden = !rec;
    later(function () { ptsEl.textContent = score + " Pts"; resultEl.hidden = false; state = "done"; }, 550);
  }

  // Anteil, wie weit ein Stachel schon herausgefahren ist (Animation nach dem Neuwürfeln)
  function grow(sp) { return sp.t0 < 0 ? 1 : Math.max(0, Math.min(1, (clock - sp.t0 - 0.12) / 0.2)); }
  function spikeHit(side) {
    var half = boxS / 2 * HIT;
    var edge = side === "R" ? Ws - (bx + half) : bx - half;   // Abstand Boxkante zur Wand
    var depth = SPIKE_D * Ws;
    if (edge > depth) return false;
    var list = walls[side];
    for (var i = 0; i < list.length; i++) {
      var g = grow(list[i]);
      if (g < 1) continue;
      var d = Math.max(0, edge);
      var halfH = SPIKE_H * fH / 2 * (1 - d / depth);
      if (Math.abs(list[i].y * fH - by * fH) < half + halfH) return true;
    }
    return false;
  }
  function physics(dt) {
    clock += dt;
    var travel = Ws - boxS;
    var vx = travel / crossTime(score);
    vy += GRAV * dt;
    by += vy * dt;
    bx += dir * vx * dt;
    var halfY = boxS / 2 * HIT / fH;
    if (by - halfY < 0 || by + halfY > 1) { die(); return; }
    if (spikeHit(dir > 0 ? "R" : "L")) { die(); return; }
    if (dir > 0 && bx + boxS / 2 >= Ws) {
      bx = Ws - boxS / 2; dir = -1; score++;
      setWall("R", spikesFor(score), true);
    } else if (dir < 0 && bx - boxS / 2 <= 0) {
      bx = boxS / 2; dir = 1; score++;
      setWall("L", spikesFor(score), true);
    }
    // Pixelspur
    trailT -= dt;
    if (trailT <= 0) {
      trailT = 0.035;
      trail.push({ x: bx, y: by * fH, s: boxS * 0.5, t: clock });
    }
    while (trail.length && clock - trail[0].t > 0.45) trail.shift();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, Hs);
    g.addColorStop(0, COL.bgTop); g.addColorStop(1, COL.bgBot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, Ws, Hs);
    // Linien
    ctx.fillStyle = COL.line;
    ctx.fillRect(0, fTop - LINE, Ws, LINE);
    ctx.fillRect(0, Hs - LINE, Ws, LINE);
    drawSpikes();
    function drawSpikes() {
    var depth = SPIKE_D * Ws, sh = SPIKE_H * fH;
    ctx.fillStyle = COL.spike;
    ["L", "R"].forEach(function (side) {
      walls[side].forEach(function (sp) {
        var gr = grow(sp); if (gr <= 0) return;
        var y = fTop + sp.y * fH, d = depth * gr;
        ctx.beginPath();
        if (side === "L") { ctx.moveTo(0, y - sh / 2); ctx.lineTo(d, y); ctx.lineTo(0, y + sh / 2); }
        else { ctx.moveTo(Ws, y - sh / 2); ctx.lineTo(Ws - d, y); ctx.lineTo(Ws, y + sh / 2); }
        ctx.closePath(); ctx.fill();
      });
    });
    }
    // Spur
    trail.forEach(function (p) {
      var a = 1 - (clock - p.t) / 0.45, sz = p.s * a;
      ctx.fillStyle = "rgba(" + COL.trail + "," + (a * 0.9).toFixed(3) + ")";
      ctx.fillRect(p.x - sz / 2, fTop + p.y - sz / 2, sz, sz);
    });
    // Punktestand
    ctx.font = "800 " + Math.round(Ws * 0.135) + "px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var scoreY = fTop + fH * 0.087;
    // Box: leicht in Flugrichtung geneigt
    var tilt = Math.max(-0.62, Math.min(0.62, vy * 1.22)) * dir;
    ctx.save(); ctx.translate(bx, fTop + by * fH); ctx.rotate(tilt);
    ctx.fillStyle = COL.box; ctx.fillRect(-boxS / 2, -boxS / 2, boxS, boxS);
    ctx.restore();
    if (state === "idle") {
      ctx.fillStyle = COL.dim; ctx.fillRect(0, fTop - LINE, Ws, Hs);
      ctx.fillStyle = "#4a4a4a"; ctx.fillText("0", Ws / 2, scoreY);
      ctx.fillStyle = COL.line; ctx.fillRect(0, fTop - LINE, Ws, LINE); ctx.fillRect(0, Hs - LINE, Ws, LINE);
      drawSpikes();
      return;
    }
    ctx.fillStyle = COL.box; ctx.fillText(String(score), Ws / 2, scoreY);
  }

  function frame(t) {
    if (state === "run") {
      var dt = Math.min(0.05, (t - last) / 1000);
      var n = Math.max(1, Math.ceil(dt / (1 / 240)));
      for (var i = 0; i < n && state === "run"; i++) physics(dt / n);
    }
    last = t;
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest && (e.target.closest(".bar") || e.target.closest(".result"))) return;
    e.preventDefault();
    jump();
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === "ArrowUp") { e.preventDefault(); jump(); }
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("ok"), idle);

  idle();
  requestAnimationFrame(function (t) { last = t; frame(t); });
  window.__dw = {
    get s() { return { state: state, score: score, bx: bx / Ws, by: by, vy: vy, dir: dir, L: walls.L.map(function (s) { return s.y; }), R: walls.R.map(function (s) { return s.y; }), box: boxS / fH, sh: SPIKE_H }; }
  };
})();
</script>

</body></html>
