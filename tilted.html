<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Tilted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Tilted: links/rechts tippen, damit der Ball auf der Wippe bleibt. Punkte = Sekunden, in der Mitte (PERFEKT) zählt es doppelt.
   Aus der Aufnahme gemessen (390 x 844): Wippe 193 px lang, 12,5 px dick, Drehpunkt bei 73,8 % Höhe; Ball r 15,3 px;
   ab 8,2 s schrumpft die Wippe um 6,4 px/s. Wippe: Federung 0,90/s², Dämpfung 0,76/s, Ball-Drehmoment 0,0067 rad/s² pro px,
   Tipp = +-27,4 °/s über 0,1 s. Ball: 180 px/s² * sin(Winkel), Reibung 0,54/s. PERFEKT nach 1,0 s innerhalb +-11 px. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: #2b5d44; color: #fff; font-family: var(--font); font-weight: 800; position: relative; overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; z-index: 6; }
.bar button, .best { background: rgba(10, 30, 20, 0.45); color: #fff4e6; border: 0; border-radius: 999px; padding: 0.5em 0.95em; font: inherit; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result { position: absolute; inset: 0; z-index: 7; background: rgba(6, 18, 12, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(13vw, 56px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button { margin-top: 10px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<canvas id="cv"></canvas>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0.00s</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>
<script>
(function () {
  // Alle Längen in "u" = Pixel bei 390 px Bildbreite
  var BEAM_L = 193, BEAM_T = 12.5, PIV_Y = 623 / 844, APEX_Y = 631 / 844, BASE_Y = 812 / 844, BASE_HW = 65, GROUND_Y = 780 / 844;
  var BALL_R = 15.3, CENTER_W = 22, PERF_W = 11, PERF_HOLD = 1.0;
  var SHRINK_AT = 8.2, SHRINK_V = 6.4, MIN_L = 0;
  var K = 0.90, C = 0.76, M = 0.0067, J = 0.478, TAU = 0.1, MAX_A = 45 * Math.PI / 180;
  var G_BEAM = 180, FRIC = 0.54, G_FALL = 520;
  var COL_BG = "#2b5d44", COL_LIGHT = "#a7c77c", COL_DARK = "#436a33", COL_BALL = "#fffb85";
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), Ws, Hs, dpr, S;
  function layout() { dpr = Math.min(3, window.devicePixelRatio || 1); Ws = window.innerWidth; Hs = window.innerHeight; S = Ws / 390;
    cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr); }
  window.addEventListener("resize", layout); layout();

  var state, th, om, s, sv, len, t, score, inZone, perfect, pushes, flashes, fall, gen = 0, best = 0, overAt = 0;
  try { best = parseFloat(localStorage.getItem("tilted-best")) || 0; } catch (e) {}
  var bestEl = document.getElementById("best");
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best.toFixed(2) + "s" : "--"); }
  showBest();
  function reset() {
    gen++; state = "intro"; th = 0; om = 0; s = 0; sv = 0; len = BEAM_L; t = 0; score = 0; inZone = 0; perfect = false;
    pushes = []; flashes = []; fall = null; document.getElementById("result").hidden = true;
  }
  function over() {
    state = "over"; overAt = performance.now();
    var sc = Math.floor(score * 100) / 100, rec = sc > best;
    if (rec) { best = sc; try { localStorage.setItem("tilted-best", String(best)); } catch (e) {} showBest(); }
    document.getElementById("rec").hidden = !rec;
    document.getElementById("pts").textContent = sc.toFixed(2) + "s";
    var g = gen; setTimeout(function () { if (g === gen) document.getElementById("result").hidden = false; }, 1100);
  }
  function tap(side) {
    pushes.push({ sg: side, left: TAU });
    flashes.push({ side: side, t: 0 });
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
  }
  function step(dt) {
    t += dt;
    // Wippe
    var a = -K * th - C * om + M * s;
    for (var i = pushes.length - 1; i >= 0; i--) {
      var p = pushes[i], d = Math.min(dt, p.left);
      a += p.sg * J / TAU * d / dt; p.left -= dt; if (p.left <= 0) pushes.splice(i, 1);
    }
    om += a * dt; th += om * dt;
    if (th > MAX_A) { th = MAX_A; if (om > 0) om = 0; }
    if (th < -MAX_A) { th = -MAX_A; if (om < 0) om = 0; }
    if (t > SHRINK_AT) len = Math.max(MIN_L, BEAM_L - (t - SHRINK_AT) * SHRINK_V);
    // Ball rollt auf der Wippe
    sv += (G_BEAM * Math.sin(th) - FRIC * sv) * dt; s += sv * dt;
    // Punkte: 1 pro Sekunde, PERFEKT (nach 1 s in der Mitte) doppelt
    if (Math.abs(s) <= PERF_W) { inZone += dt; perfect = inZone >= PERF_HOLD; } else { inZone = 0; perfect = false; }
    score += dt * (perfect ? 2 : 1);
    if (Math.abs(s) > len / 2) {
      // fällt herunter
      var p0 = ballPos();
      fall = { x: p0.x, y: p0.y, vx: sv * Math.cos(th), vy: sv * Math.sin(th) };
      perfect = false; over();
    }
  }
  function ballPos() {
    var c = Math.cos(th), sn = Math.sin(th), d = BALL_R + BEAM_T / 2;
    return { x: 195 + s * c + d * sn, y: PIV_Y * Hs / S + s * sn - d * c };
  }
  function stepFall(dt) {
    if (!fall) return;
    fall.vy += G_FALL * dt; fall.x += fall.vx * dt; fall.y += fall.vy * dt;
    var gy = GROUND_Y * Hs / S + 16;
    if (fall.y > gy) { fall.y = gy; fall.vy = -fall.vy * 0.25; fall.vx *= 0.7; if (Math.abs(fall.vy) < 20) fall.vy = 0; }
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COL_BG; ctx.fillRect(0, 0, Ws, Hs);
    // Tipp-Aufhellung der angetippten Hälfte
    for (var i = flashes.length - 1; i >= 0; i--) {
      var f = flashes[i], k = f.t < 0.05 ? f.t / 0.05 : Math.max(0, 1 - (f.t - 0.05) / 0.22);
      if (f.t > 0.3) { flashes.splice(i, 1); continue; }
      var x0 = f.side < 0 ? -40 : Ws * 0.55, w = Ws * 0.45 + 40, y0 = Hs * 0.238;
      var gr = ctx.createLinearGradient(f.side < 0 ? x0 + w : x0, 0, f.side < 0 ? x0 + w - Ws * 0.06 : x0 + Ws * 0.06, 0);
      gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(255,255,255," + (0.13 * k) + ")");
      ctx.fillStyle = gr; rr(x0, y0, w, Hs - y0, Ws * 0.07); ctx.fill();
    }
    // Boden
    ctx.fillStyle = COL_DARK; ctx.fillRect(0, GROUND_Y * Hs, Ws, Hs);
    // Ständer
    var cx = Ws / 2, py = PIV_Y * Hs;
    ctx.fillStyle = COL_LIGHT; ctx.beginPath(); ctx.moveTo(cx, APEX_Y * Hs); ctx.lineTo(cx + BASE_HW * S, BASE_Y * Hs); ctx.lineTo(cx - BASE_HW * S, BASE_Y * Hs); ctx.closePath(); ctx.fill();
    // Wippe
    ctx.save(); ctx.translate(cx, py); ctx.rotate(th);
    ctx.fillStyle = COL_LIGHT; ctx.fillRect(-len / 2 * S, -BEAM_T / 2 * S, len * S, BEAM_T * S);
    ctx.fillStyle = COL_DARK; ctx.fillRect(-CENTER_W / 2 * S, -BEAM_T / 2 * S, CENTER_W * S, BEAM_T * S);
    ctx.restore();
    // Ball
    var b = fall ? { x: fall.x, y: fall.y } : ballPos();
    ctx.fillStyle = COL_BALL; ctx.beginPath(); ctx.arc(b.x * S, b.y * S, BALL_R * S, 0, 7); ctx.fill();
    // Punkte
    var font = getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.round(Ws * 0.135) + "px " + font;
    ctx.fillText(String(Math.floor(score)), cx, Hs * 0.306);
    if (perfect && state === "run") { ctx.font = "800 " + Math.round(Ws * 0.052) + "px " + font; ctx.fillText("PERFEKT (2x)", cx, Hs * 0.44); }
    if (state === "intro") {
      ctx.fillStyle = "rgba(10,14,12,0.78)"; rr(0, Hs * 0.238, Ws, Hs, Ws * 0.07); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(Ws * 0.068) + "px " + font;
      ctx.fillText("Tippe links/rechts", cx, Hs * 0.588); ctx.fillText("um den Ball zu", cx, Hs * 0.62); ctx.fillText("balancieren.", cx, Hs * 0.651);
      var ph = (performance.now() / 1000) % 1.6, which = ph < 0.8 ? -1 : 1, q = Math.sin((ph % 0.8) / 0.8 * Math.PI);
      [-1, 1].forEach(function (sd) {
        var on = sd === which ? q : 0, r = (32 + 8 * on) * S;
        ctx.fillStyle = "rgba(255,255,255," + (0.22 + 0.78 * on) + ")";
        ctx.beginPath(); ctx.arc(cx + sd * 102.5 * S, Hs * 0.898, r, 0, 7); ctx.fill();
      });
    }
  }
  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (var i = 0; i < flashes.length; i++) flashes[i].t += dt;
    if (state === "run") { var n = Math.ceil(dt / 0.004); for (var j = 0; j < n && state === "run"; j++) step(dt / n); }
    if (state === "over") stepFall(dt);
    draw();
  }
  function ui(e) { return e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest("#trx")); }
  document.addEventListener("pointerdown", function (e) {
    if (ui(e)) return; e.preventDefault();
    if (state === "over") return;
    var side = e.clientX < Ws / 2 ? -1 : 1;
    if (state === "intro") state = "run";
    tap(side);
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), reset);
  bindTap(document.getElementById("ok"), reset);
  reset();
  requestAnimationFrame(function (n) { last = n; frame(n); });
  window.__tl = { get s() { return { state: state, th: th, om: om, s: s, sv: sv, len: len, t: t, score: score, perfect: perfect }; }, tap: function (sd) { if (state === "intro") state = "run"; tap(sd); } };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}
#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}
#trx h2{font:800 20px system-ui,-apple-system,sans-serif;margin:0}
#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}
#trx textarea{width:min(340px,90vw);height:110px;border-radius:12px;border:1px solid #555;background:#1b1b1f;color:#eee;font:12px ui-monospace,monospace;padding:10px;resize:none}
#trx .row{display:flex;gap:10px}
#trx button{border:0;border-radius:12px;padding:12px 18px;font:800 16px system-ui,-apple-system,sans-serif;cursor:pointer;background:#3a3a3c;color:#fff}
#trx button.main{background:#f5d55a;color:#111}
#trx button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
