<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>7 Sekunden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* 7 Sekunden: einmal tippen = Timer startet, nochmal tippen so nah wie möglich an 7,00 s. Ergebnis = Abstand zu 7 s (weniger ist besser).
   Maße aus der Aufnahme (390 x 844): Ring-Mitte bei 57,1 % Höhe, Außenradius 36,7 % der Breite, Ringstärke 6,4 %;
   Ring füllt sich im Uhrzeigersinn von oben und ist bei 7 s voll; Hinweis darunter bei 81,3 %. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: #0b0e14; color: #fff; font-family: var(--font); font-weight: 800; position: relative; overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; z-index: 6; }
.bar button, .best { background: rgba(255, 255, 255, 0.08); color: #fff4e6; border: 0; border-radius: 999px; padding: 0.5em 0.95em; font: inherit; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result { position: absolute; inset: 0; z-index: 7; background: rgba(8, 4, 16, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(13vw, 56px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button { margin-top: 10px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.fast { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); z-index: 6;
  display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px; margin: -4px; color: #f3f2d4; font: inherit; font-size: 14px; cursor: pointer; }
.fast i { width: 24px; height: 24px; border: 2px solid #f3f2d4; border-radius: 7px; opacity: 0.55; box-sizing: border-box; }
.fast span { opacity: 0.55; font-variant-numeric: tabular-nums; }
.fast[aria-pressed="true"] i { background: #ffd850; border-color: #ffd850; opacity: 1; }
.fast[aria-pressed="true"] span { opacity: 1; }
.fast:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 8px; }
</style>
<canvas id="cv"></canvas>
<button class="fast" id="fast" type="button" aria-pressed="false" aria-label="Timer startet bei 5 Sekunden"><i></i><span>5</span></button>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0.00s</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>
<script>
(function () {
  var TARGET = 7, LIMIT = 10, CY = 0.571, RO = 0.367, TH = 0.064, HINT_Y = 0.813;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), Ws, Hs, dpr;
  function layout() { dpr = Math.min(3, window.devicePixelRatio || 1); Ws = window.innerWidth; Hs = window.innerHeight; cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr); }
  window.addEventListener("resize", layout); layout();
  var state = "idle", t0 = 0, stopT = 0, best = 0, gen = 0, recNow = false;
  // Übungsmodus "5": Timer startet schon bei 5,00 s, eigener Highscore
  var from5 = false, fastBtn = document.getElementById("fast");
  try { from5 = localStorage.getItem("siebensek-5") === "1"; } catch (e) {}
  function key() { return from5 ? "siebensek-best-5" : "siebensek-best"; }
  function startAt() { return from5 ? 5 : 0; }
  function loadBest() { try { best = parseFloat(localStorage.getItem(key())); if (!(best >= 0)) best = 0; } catch (e) { best = 0; } }
  loadBest();
  var bestEl = document.getElementById("best");
  function hasBest() { try { return localStorage.getItem(key()) !== null; } catch (e) { return false; } }
  function showBest2() { bestEl.innerHTML = "<b>Best</b>" + (hasBest() ? best.toFixed(2) + "s" : "--"); }
  showBest2();
  function elapsed() { return state === "run" ? (performance.now() - t0) / 1000 : state === "idle" ? startAt() : stopT; }
  function finish(late) {
    var g = gen, sc = late ? null : Math.abs(stopT - TARGET);
    var shown = late ? "Zu spät" : (Math.round(sc * 100) / 100).toFixed(2) + "s";
    var rec = !late && (!hasBest() || sc < best);
    if (rec) { best = Math.round(sc * 100) / 100; try { localStorage.setItem(key(), String(best)); } catch (e) {} showBest2(); }
    document.getElementById("rec").hidden = !rec;
    document.getElementById("pts").textContent = shown;
    recNow = rec; // kein Ergebnis-Fenster: Ergebnis steht unter dem Ring, nächster Tipp startet sofort den nächsten Lauf
  }
  function reset() { gen++; state = "idle"; stopT = 0; document.getElementById("result").hidden = true; }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0b0e14"; ctx.fillRect(0, 0, Ws, Hs);
    var t = elapsed();
    if (state === "run" && t >= LIMIT) { state = "late"; stopT = LIMIT; finish(true); t = LIMIT; }
    var cx = Ws / 2, cy = Hs * CY, ro = RO * Ws, th = TH * Ws, rm = ro - th / 2;
    ctx.lineWidth = th; ctx.lineCap = "butt";
    ctx.strokeStyle = "#383a44"; ctx.beginPath(); ctx.arc(cx, cy, rm, 0, Math.PI * 2); ctx.stroke();
    var k = Math.min(1, t / TARGET);
    if (k > 0) { ctx.strokeStyle = "#27f2be"; ctx.beginPath(); ctx.arc(cx, cy, rm, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); }
    var font = getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // Zahl mit festen Zeichenbreiten (jede Ziffer in gleich breiter Zelle), damit nichts wackelt;
    // Gesamtbreite ist fest (49 % der Bildbreite wie im Original) und mittig, passt sicher in den Ring.
    drawNumber(t.toFixed(2), cx, cy, Ws * 0.49, font);
    ctx.font = "800 " + Math.round(Ws * 0.05) + "px " + font;
    var hint = state === "stop" ? "UM " + Math.abs(stopT - TARGET).toFixed(4) + "s DANEBEN" : state === "late" ? "ZU SPÄT" : "BEI 7 TIPPEN";
    if (state !== "idle") ctx.fillText(hint, cx, Hs * HINT_Y);
    if (state === "stop" && recNow) { ctx.fillStyle = "#ffd34d"; ctx.font = "800 " + Math.round(Ws * 0.04) + "px " + font; ctx.fillText("NEUER REKORD", cx, Hs * HINT_Y + Ws * 0.08); ctx.fillStyle = "#fff"; }
    if (state === "idle") {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, Ws, Hs);
      ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(Ws * 0.068) + "px " + font;
      ctx.fillText("Tippe zum Start,", cx, cy + Ws * 0.07); ctx.fillText("dann bei 7s", cx, cy + Ws * 0.137);
      var pu = 0.5 + 0.5 * Math.sin(performance.now() / 1000 * 4);
      ctx.fillStyle = "rgba(255,255,255," + (0.3 + 0.6 * pu) + ")"; ctx.beginPath(); ctx.arc(cx, Hs * 0.818, Ws * 0.06, 0, 7); ctx.fill();
    }
  }
  function drawNumber(txt, cx, cy, targetW, font) {
    var fs = 100, i, dw = 0, pw;
    ctx.font = "800 " + fs + "px " + font;
    for (i = 0; i <= 9; i++) dw = Math.max(dw, ctx.measureText(String(i)).width);
    pw = ctx.measureText(".").width;
    // Breite für "0.00": 3 Ziffern + Punkt; Schrift so skalieren, dass das genau targetW ergibt
    var k = targetW / (3 * dw + pw * 1.15);
    fs *= k; dw *= k; pw *= k * 1.15;
    ctx.font = "800 " + fs.toFixed(1) + "px " + font; ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var digitsBefore = txt.indexOf("."), total = digitsBefore * dw + pw + (txt.length - digitsBefore - 1) * dw;
    // linke Kante fest: Block für "0.00" mittig, längere Zahlen (10.00) wachsen nach links
    var x = cx - (3 * dw + pw) / 2 - (digitsBefore - 1) * dw;
    for (i = 0; i < txt.length; i++) {
      var ch = txt[i], w = ch === "." ? pw : dw;
      ctx.fillText(ch, x + w / 2, cy + fs * 0.04); x += w;
    }
  }
  function frame() { requestAnimationFrame(frame); draw(); }
  function ui(e) { return e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest("#trx") || e.target.closest(".fast")); }
  document.addEventListener("pointerdown", function (e) {
    if (ui(e)) return; e.preventDefault();
    if (state === "idle") { state = "run"; t0 = performance.now() - startAt() * 1000; return; }
    if (state === "run") { stopT = (performance.now() - t0) / 1000; state = "stop"; finish(false); return; }
    if (state === "stop" || state === "late") { recNow = false; state = "run"; t0 = performance.now() - startAt() * 1000; }
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), reset);
  function setFast(v) { from5 = v; fastBtn.setAttribute("aria-pressed", v ? "true" : "false"); try { localStorage.setItem("siebensek-5", v ? "1" : "0"); } catch (e) {} loadBest(); showBest2(); reset(); }
  setFast(from5);
  bindTap(fastBtn, function () { if (state === "run") return; setFast(!from5); });
  bindTap(document.getElementById("ok"), reset);
  reset(); requestAnimationFrame(frame);
  window.__ot = { get s() { return { state: state, t: elapsed() }; } };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}
#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}
#trx h2{font:800 20px system-ui,-apple-system,sans-serif;margin:0}
#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}
#trx textarea{width:min(340px,90vw);height:110px;border-radius:12px;border:1px solid #555;background:#1b1b1f;color:#eee;font:12px ui-monospace,monospace;padding:10px;resize:none}
#trx .row{display:flex;gap:10px}
#trx button{border:0;border-radius:12px;padding:12px 18px;font:800 16px system-ui,-apple-system,sans-serif;cursor:pointer;background:#3a3a3c;color:#fff}
#trx button.main{background:#f5d55a;color:#111}
#trx button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
