<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Piano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Piano: weiße Tasten scrollen nach unten, jede antippen, bevor sie unten verschwindet.
   Maße aus der Bildschirmaufnahme (1170 x 2532): Feld ab 23,7 % Höhe, 4 Spalten, 4 Reihen sichtbar. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: #1d1233;
  color: #fff;
  font-family: var(--font);
  font-weight: 800;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; z-index: 6;
}
.bar button, .best {
  background: rgba(10, 4, 22, 0.6);
  color: #fff4e6;
  border: 0; border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit; font-size: 14px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result {
  position: absolute; inset: 0; z-index: 7;
  background: rgba(8, 4, 16, 0.9);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(11vw, 52px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button { margin-top: 10px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<canvas id="cv"></canvas>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0 Pts</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>

<script>
(function () {
  // Gemessen: Tempo 470 px/s (bei 585 px Breite, Feld 966 px hoch) plus 7,6 px/s pro Punkt,
  // also knapp 2 Reihen pro Sekunde am Anfang und gut 4 bei 70 Punkten.
  // Etwa jede fünfte Reihe hat zwei weiße Tasten.
  var COLS = 4, ROWS = 4, FIELD_TOP = 300 / 1266, REF_H = 966, DOUBLE = 0.22;
  function speedFor(s) { return Math.min(1700, 470 + 7.6 * s); }

  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var bestEl = document.getElementById("best"), resultEl = document.getElementById("result");
  var Ws, Hs, dpr, fTop, fH, rowH, colW;
  function layout() {
    dpr = Math.min(3, window.devicePixelRatio || 1);
    Ws = window.innerWidth; Hs = window.innerHeight;
    cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr);
    fTop = Hs * FIELD_TOP; fH = Hs - fTop; rowH = fH / ROWS; colW = Ws / COLS;
  }
  window.addEventListener("resize", layout);
  layout();

  var state = "idle", score = 0, best = 0, rows = [], offset = 0, nextId = 0, last = 0, bad = null, gen = 0;
  try { best = parseInt(localStorage.getItem("piano-best"), 10) || 0; } catch (e) {}
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best : "--"); }
  showBest();

  function newRow() {
    var c = Math.floor(Math.random() * COLS), cells = [c];
    if (Math.random() < DOUBLE) { var d; do { d = Math.floor(Math.random() * COLS); } while (d === c); cells.push(d); }
    var r = { id: nextId++, tiles: {} };
    cells.forEach(function (x) { r.tiles[x] = "on"; });
    rows.push(r);
  }
  // Reihe n liegt (in Reihenhöhen) bei: obere Kante = (ROWS - 1 - n) + offset
  function rowTop(r) { return (ROWS - 1 - r.id + offset) * rowH; }
  function idle() {
    gen++;
    state = "idle"; score = 0; offset = 0; nextId = 0; rows = []; bad = null;
    resultEl.hidden = true;
    // unterste Reihe: eine einzelne Starttaste
    rows.push({ id: nextId++, tiles: (function () { var t = {}; t[Math.floor(Math.random() * COLS)] = "on"; return t; })() });
    while (nextId < ROWS + 2) newRow();
  }
  function fail(row, col) {
    state = "fail"; bad = { row: row, col: col };
    var rec = score > best;
    if (rec) { best = score; try { localStorage.setItem("piano-best", String(best)); } catch (e) {} showBest(); }
    document.getElementById("rec").hidden = !rec;
    var g = gen;
    setTimeout(function () { if (g !== gen) return; document.getElementById("pts").textContent = score + " Pts"; resultEl.hidden = false; state = "done"; }, 1100);
  }
  function hit(x, y) {
    if (state !== "idle" && state !== "run") return;
    if (y < fTop) return;
    var col = Math.min(COLS - 1, Math.floor(x / colW));
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], top = fTop + rowTop(r);
      if (y >= top && y < top + rowH) {
        var t = r.tiles[col];
        if (t === "on") {
          if (state === "idle") { if (r.id !== 0) return; state = "run"; last = performance.now(); }
          r.tiles[col] = "done"; score++;
          return;
        }
        if (t === "done") return;
        if (state === "idle") return;
        fail(r, col);
        return;
      }
    }
  }
  function step(dt) {
    offset += speedFor(score) * (fH / REF_H) / rowH * dt;
    // neue Reihen oben nachschieben, alte unten entfernen
    while (rowTop(rows[rows.length - 1]) > -rowH) newRow();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (rowTop(r) >= fH) {
        for (var c in r.tiles) if (r.tiles[c] === "on") { fail(r, +c); return; }
      }
    }
    while (rows.length && rowTop(rows[0]) > fH + rowH) rows.shift();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, Hs);
    g.addColorStop(0, "#1b1030"); g.addColorStop(1, "#24163f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, Ws, Hs);
    ctx.save(); ctx.beginPath(); ctx.rect(0, fTop, Ws, fH); ctx.clip();
    var gap = 2;
    rows.forEach(function (r) {
      var top = fTop + rowTop(r);
      for (var c in r.tiles) {
        var st = r.tiles[c], x = c * colW;
        if (st === "on") ctx.fillStyle = state === "idle" ? "#4a4a4c" : "#ebe9ef";
        else ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.fillRect(x + gap / 2, top + gap / 2, colW - gap, rowH - gap);
      }
    });
    if (bad) {
      var bt = fTop + rowTop(bad.row);
      ctx.fillStyle = "#a12a3c"; ctx.fillRect(bad.col * colW + 1, bt + 1, colW - 2, rowH - 2);
    }
    ctx.restore();
    if (state === "idle") { ctx.fillStyle = "rgba(10, 4, 14, 0.55)"; ctx.fillRect(0, fTop, Ws, fH); }
    ctx.font = "800 " + Math.round(Ws * 0.17) + "px " + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = state === "idle" ? "rgba(255, 255, 255, 0.35)" : "#ffffff";
    ctx.fillText(String(score), Ws / 2, Hs * (388 / 1266));
    if (state === "idle") {
      ctx.font = "800 " + Math.round(Math.min(Ws * 0.075, 32)) + "px " + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = "#fff";
      ctx.fillText("Tippe auf die", Ws / 2, Hs * 0.60);
      ctx.fillText("Tasten", Ws / 2, Hs * 0.60 + Math.min(Ws * 0.085, 36));
    }
  }
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (state === "run") { var n = Math.max(1, Math.ceil(dt / (1 / 240))); for (var i = 0; i < n && state === "run"; i++) step(dt / n); }
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest("#trx"))) return;
    e.preventDefault();
    hit(e.clientX, e.clientY);
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("ok"), idle);

  idle();
  requestAnimationFrame(function (t) { last = t; frame(t); });
  window.__piano = {
    get s() {
      var list = [];
      rows.forEach(function (r) { for (var c in r.tiles) if (r.tiles[c] === "on") list.push({ x: (+c + 0.5) * colW, y: fTop + rowTop(r) + rowH / 2, id: r.id }); });
      return { state: state, score: score, tiles: list };
    }
  };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}
#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}
#trx h2{font:800 20px system-ui,-apple-system,sans-serif;margin:0}
#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}
#trx textarea{width:min(340px,90vw);height:110px;border-radius:12px;border:1px solid #555;background:#1b1b1f;color:#eee;font:12px ui-monospace,monospace;padding:10px;resize:none}
#trx .row{display:flex;gap:10px}
#trx button{border:0;border-radius:12px;padding:12px 18px;font:800 16px system-ui,-apple-system,sans-serif;cursor:pointer;background:#3a3a3c;color:#fff}
#trx button.main{background:#f5d55a;color:#111}
#trx button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
