<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Color Memory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Color Memory: Farbe 4 Sekunden merken, dann mit Farbton / Sättigung / Helligkeit nachstellen. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: #17131f; color: #fff; font-family: var(--font); font-weight: 800;
  position: relative; overflow: hidden; transition: background-color 0.05s linear;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.bar {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; z-index: 6;
}
.bar button, .best {
  background: rgba(10, 4, 22, 0.6); color: #fff4e6; border: 0; border-radius: 999px;
  padding: 0.5em 0.95em; font: inherit; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.scr[hidden] { display: none; }
#go { width: 76px; height: 76px; border-radius: 50%; border: 0; background: #fff; cursor: pointer; box-shadow: 0 0 0 10px rgba(255,255,255,0.12); }
#go:active { transform: scale(0.93); }
#go:focus-visible { outline: 3px solid #ffd34d; outline-offset: 6px; }
.pill { position: absolute; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.28); color: #fff; padding: 0.45em 1.1em; border-radius: 999px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
.timer { position: absolute; top: calc(112px + env(safe-area-inset-top, 0px)); left: 8%; right: 8%; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.22); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: #fff; border-radius: 4px; transform-origin: left; }
.panel { position: absolute; left: 6%; right: 6%; bottom: calc(6% + env(safe-area-inset-bottom, 0px)); background: rgba(16, 12, 24, 0.92); border-radius: 22px; padding: 18px 18px 16px; }
.lab { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; margin: 2px 2px 8px; }
.sl { position: relative; height: 30px; border-radius: 15px; margin-bottom: 16px; touch-action: none; }
.sl .k { position: absolute; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.45); border: 3px solid rgba(255,255,255,0.9); pointer-events: none; }
#hue { background: linear-gradient(90deg, #f00, #ff0 16.67%, #0f0 33.33%, #0ff 50%, #00f 66.67%, #f0f 83.33%, #f00); }
#log { width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-size: 17px; letter-spacing: 0.06em; background: #fff; color: #17131f; cursor: pointer; margin-top: 2px; }
#log:active { transform: scale(0.97); }
#log:focus-visible { outline: 3px solid #ffd34d; outline-offset: 3px; }
#res { background: rgba(8, 4, 16, 0.94); gap: 14px; }
.sw { display: flex; gap: 16px; }
.sw div { text-align: center; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9; }
.sw span { display: block; width: 34vw; max-width: 150px; aspect-ratio: 1; border-radius: 18px; border: 4px solid #fff; margin-bottom: 8px; }
.pct { font-size: min(13vw, 58px); line-height: 1; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.rec[hidden] { display: none; }
#ok { margin-top: 6px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
#ok:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>

<div class="scr" id="s0"><button id="go" type="button" aria-label="Start"></button></div>
<div class="scr" id="s1" hidden><div class="pill">Merken</div><div class="timer"><i id="tb"></i></div></div>
<div class="scr" id="s2" hidden>
  <div class="pill">Stell sie nach</div>
  <div class="panel">
    <div class="lab">Farbton</div><div class="sl" id="hue" data-k="h"><div class="k"></div></div>
    <div class="lab">Sättigung</div><div class="sl" id="sat" data-k="s"><div class="k"></div></div>
    <div class="lab">Helligkeit</div><div class="sl" id="bri" data-k="b"><div class="k"></div></div>
    <button id="log" type="button">EINLOGGEN</button>
  </div>
</div>
<div class="scr" id="res" hidden>
  <div class="sw"><div><span id="swT"></span>Ziel</div><div><span id="swU"></span>Deins</div></div>
  <div class="pct" id="pct">0%</div>
  <div class="lbl" style="font-size:22px">Treffer</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>

<script>
(function () {
  var MEMO = 4.0; // gemessen: Merk-Balken läuft rund 4 Sekunden
  var best = 0, target = null, cur = { h: 0.5, s: 0.5, b: 0.5 }, gen = 0;
  try { best = parseFloat(localStorage.getItem("colormem-best")) || 0; } catch (e) {}
  var bestEl = document.getElementById("best");
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best.toFixed(2) + "%" : "--"); }
  showBest();
  function $(id) { return document.getElementById(id); }
  function show(id) { ["s0", "s1", "s2", "res"].forEach(function (s) { $(s).hidden = s !== id; }); }

  function hsv2rgb(h, s, v) {
    var i = Math.floor(h * 6) % 6, f = h * 6 - Math.floor(h * 6), p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    var r = [v, q, p, p, t, v][i], g = [t, v, v, q, p, p][i], b = [p, p, t, v, v, q][i];
    return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
  }
  function css(c) { var r = hsv2rgb(c.h, c.s, c.b); return "rgb(" + r[0] + "," + r[1] + "," + r[2] + ")"; }
  function lab(rgb) {
    var c = rgb.map(function (x) { x /= 255; return x > 0.04045 ? Math.pow((x + 0.055) / 1.055, 2.4) : x / 12.92; });
    var X = (c[0] * 0.4124 + c[1] * 0.3576 + c[2] * 0.1805) / 0.95047, Y = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722, Z = (c[0] * 0.0193 + c[1] * 0.1192 + c[2] * 0.9505) / 1.08883;
    function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
    return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
  }
  function score(a, b) {
    var A = lab(hsv2rgb(a.h, a.s, a.b)), B = lab(hsv2rgb(b.h, b.s, b.b));
    var d = Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]);
    return Math.max(0, 100 - 0.6 * d);
  }

  function paint() {
    document.body.style.backgroundColor = css(cur);
    var full = hsv2rgb(cur.h, 1, 1), fullC = "rgb(" + full.join(",") + ")";
    var gray = hsv2rgb(cur.h, 0, cur.b), colB = hsv2rgb(cur.h, 1, cur.b);
    $("sat").style.background = "linear-gradient(90deg, rgb(" + gray.join(",") + "), rgb(" + colB.join(",") + "))";
    var dark = hsv2rgb(cur.h, cur.s, 0), lit = hsv2rgb(cur.h, cur.s, 1);
    $("bri").style.background = "linear-gradient(90deg, rgb(" + dark.join(",") + "), rgb(" + lit.join(",") + "))";
    $("hue").querySelector(".k").style.left = (cur.h * 100) + "%";
    $("sat").querySelector(".k").style.left = (cur.s * 100) + "%";
    $("bri").querySelector(".k").style.left = (cur.b * 100) + "%";
    $("hue").querySelector(".k").style.background = fullC;
    $("sat").querySelector(".k").style.background = css({ h: cur.h, s: cur.s, b: cur.b });
    $("bri").querySelector(".k").style.background = css({ h: cur.h, s: cur.s, b: cur.b });
  }

  ["hue", "sat", "bri"].forEach(function (id) {
    var el = $(id), k = el.getAttribute("data-k"), act = null;
    function set(e) { var r = el.getBoundingClientRect(); cur[k] = Math.max(0, Math.min(k === "h" ? 0.9999 : 1, (e.clientX - r.left) / r.width)); paint(); }
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); act = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (x) {} set(e); });
    el.addEventListener("pointermove", function (e) { if (act === e.pointerId) set(e); });
    el.addEventListener("pointerup", function (e) { if (act === e.pointerId) act = null; });
    el.addEventListener("pointercancel", function () { act = null; });
  });

  function idle() {
    gen++; show("s0"); document.body.style.backgroundColor = "#17131f";
  }
  function start() {
    var g = ++gen;
    target = { h: Math.random(), s: 0.25 + Math.random() * 0.75, b: 0.35 + Math.random() * 0.65 };
    document.body.style.backgroundColor = css(target);
    show("s1");
    var tb = $("tb"), t0 = performance.now();
    (function tick(t) {
      if (g !== gen) return;
      var p = Math.min(1, (t - t0) / 1000 / MEMO);
      tb.style.transform = "scaleX(" + (1 - p) + ")";
      if (p < 1) requestAnimationFrame(tick); else recreate();
    })(t0);
  }
  function recreate() {
    cur = { h: Math.random(), s: 0.2 + Math.random() * 0.8, b: 0.3 + Math.random() * 0.7 };
    show("s2"); paint();
  }
  function submit() {
    var sc = Math.round(score(target, cur) * 100) / 100;
    $("swT").style.background = css(target); $("swU").style.background = css(cur);
    $("pct").textContent = sc.toFixed(2) + "%";
    var rec = sc > best;
    if (rec) { best = sc; try { localStorage.setItem("colormem-best", String(best)); } catch (e) {} showBest(); }
    $("rec").hidden = !rec;
    show("res");
  }
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap($("go"), start);
  bindTap($("log"), submit);
  bindTap($("ok"), idle);
  bindTap($("reset"), idle);
  idle();
  window.__cm = { get s() { return { target: target, cur: cur }; }, score: score };
})();
</script>
<style>
#trx{position:fixed;inset:0;z-index:99999;background:rgba(8,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center}
#trx[hidden]{display:none}
#trx, #trx *{touch-action:manipulation !important;-webkit-user-select:text;user-select:text}
#trx h2{font:800 20px system-ui,-apple-system,sans-serif;margin:0}
#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}
#trx textarea{width:min(340px,90vw);height:110px;border-radius:12px;border:1px solid #555;background:#1b1b1f;color:#eee;font:12px ui-monospace,monospace;padding:10px;resize:none}
#trx .row{display:flex;gap:10px}
#trx button{border:0;border-radius:12px;padding:12px 18px;font:800 16px system-ui,-apple-system,sans-serif;cursor:pointer;background:#3a3a3c;color:#fff}
#trx button.main{background:#f5d55a;color:#111}
#trx button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
