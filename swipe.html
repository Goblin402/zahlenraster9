<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Swipe Fast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Swipe Fast: 4 Boxen mit Pfeilen, Wischen in Pfeilrichtung füllt den Zeitbalken der Box auf.
   Maße aus dem Original (1170 x 2532): Box 39,5 % Breite, Raster ab 46 % Höhe. Bewusst nur dunkles Design. */
:root {
  --w: min(100vw, 60vh);
  --box: #873bb8;
  --box2: #8a3ec0;
  --track: #5d2b7e;
  --font: "Syne", "Arial Black", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, #6f269e 0%, #7a29ac 40%, #882ec5 100%);
  background-color: #7a29ac;
  color: #fff;
  font-family: var(--font);
  font-weight: 800;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.bar {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
  z-index: 6;
}
.bar button, .best {
  background: rgba(30, 10, 45, 0.72);
  color: #fff4e6;
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.modebox {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: 38px; height: 38px;
  padding: 0;
  border: 2px solid rgba(255, 244, 230, 0.35);
  border-radius: 11px;
  background: rgba(30, 10, 45, 0.72);
  z-index: 6;
  cursor: pointer;
}
.modebox:active { transform: scale(0.92); }
.modebox:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.m1 .modebox { background: #fff; border-color: #fff; }
.m2 .modebox { background: #000; border-color: rgba(255, 255, 255, 0.55); }
.box::after {
  content: ""; position: absolute; inset: 0;
  background: #ff2a2a; opacity: 0; pointer-events: none;
}
.m1 .box.miss::after, .m2 .box.miss::after { opacity: 0.88; }
.hap { position: fixed; left: -40px; top: 0; width: 30px; height: 30px; opacity: 0; pointer-events: none; overflow: hidden; }
.score {
  position: absolute;
  left: 0; right: 0;
  top: 29.7%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.135);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  z-index: 3;
  pointer-events: none;
}
.grid {
  position: absolute;
  top: 46%;
  left: 50%;
  width: var(--w);
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(2, calc(var(--w) * 0.395));
  column-gap: calc(var(--w) * 0.051);
  row-gap: calc(var(--w) * 0.034);
  justify-content: center;
  z-index: 2;
}
.box {
  position: relative;
  height: calc(var(--w) * 0.407);
  border-radius: calc(var(--w) * 0.026);
  background: linear-gradient(180deg, var(--box), var(--box2));
  overflow: hidden;
  touch-action: none;
}
.box .tr {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--w) * 0.0205);
  background: var(--track);
}
.box .fill {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  background: linear-gradient(90deg, #0aaacf, #3376f3);
}
.box.low .fill { background: linear-gradient(90deg, #f76d13, #ea9f0a); }
.box svg {
  position: absolute;
  left: 50%;
  top: calc(50% - var(--w) * 0.01);
  width: calc(var(--w) * 0.118);
  height: calc(var(--w) * 0.118);
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  pointer-events: none;
  transition: opacity 0.12s;
}
.box.pop svg { animation: pop 0.14s ease-out; }
@keyframes pop { from { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.6); opacity: 0.3; } }
.box.miss svg { opacity: 0.35; }
@media (prefers-reduced-motion: reduce) { .box.pop svg { animation: none; } }

.dim {
  position: absolute;
  inset: 0;
  background: rgba(24, 10, 34, 0.84);
  z-index: 4;
  display: none;
  pointer-events: none;
}
.idle .dim { display: block; }
.idle .score { z-index: 5; color: #5a5a5a; }
.hint {
  position: absolute;
  left: 0; right: 0;
  top: 59%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.07);
  line-height: 1.08;
  z-index: 5;
  pointer-events: none;
  display: none;
}
.idle .hint { display: block; }
.finger {
  position: absolute;
  left: 50%;
  top: 91%;
  width: calc(var(--w) * 0.15);
  height: calc(var(--w) * 0.15);
  margin-left: calc(var(--w) * -0.075);
  margin-top: calc(var(--w) * -0.075);
  border-radius: 50%;
  background: rgba(200, 190, 210, 0.45);
  z-index: 5;
  pointer-events: none;
  display: none;
  animation: swipe 1.6s ease-in-out infinite;
}
.idle .finger { display: block; }
@keyframes swipe {
  0% { transform: translate(0, 0); opacity: 0; }
  15% { opacity: 1; }
  60% { transform: translate(0, calc(var(--w) * -0.12)); opacity: 1; }
  80%, 100% { transform: translate(0, calc(var(--w) * -0.12)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .finger { animation: none; } }

.result {
  position: absolute;
  inset: 0;
  background: rgba(10, 6, 16, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  z-index: 7;
}
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(11vw, 52px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button {
  margin-top: 10px;
  background: #3a3a3c;
  color: #fff;
  border: 2px solid #8a8a8e;
  border-radius: 12px;
  padding: 0.65em 1.6em;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<button class="modebox" id="mode" type="button" aria-label="Modus"></button>
<label class="hap" aria-hidden="true"><input type="checkbox" switch id="hapsw" tabindex="-1"></label>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="score" id="score">0</div>
<div class="grid" id="grid"></div>
<div class="dim"></div>
<div class="hint">Wische in<br>Richtung der<br>Pfeile!</div>
<div class="finger"></div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0 Pts</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>

<script>
(function () {
  // Werte aus dem Video gemessen: Balken leert sich anfangs mit ca. 0,13 /s und wird pro Punkt schneller,
  // jede Box hat ihr eigenes Tempo, ein richtiger Wisch gibt +42 % Balken zurück.
  var BASE = 0.13, PER_POINT = 0.005, REFILL = 0.42, LOW = 0.5;
  var FACTORS = [0.72, 0.92, 1.0, 1.36];
  var DIRS = ["up", "right", "down", "left"];
  var ROT = { up: 0, right: 90, down: 180, left: 270 };
  var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8 2.2 11.6l3 3 4.6-4.6V22.2h4.4V10l4.6 4.6 3-3Z" fill="#fff"/></svg>';

  var grid = document.getElementById("grid");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var resultEl = document.getElementById("result");
  var ptsEl = document.getElementById("pts");
  var recEl = document.getElementById("rec");

  var boxes = [];
  for (var i = 0; i < 4; i++) {
    var el = document.createElement("div");
    el.className = "box";
    el.innerHTML = ARROW + '<div class="tr"><div class="fill"></div></div>';
    grid.appendChild(el);
    boxes.push({ el: el, svg: el.querySelector("svg"), fill: el.querySelector(".fill"), dir: "up", val: 1, shown: 1, factor: 1, low: false });
  }

  var state = "idle", score = 0, best = 0, gen = 0, last = 0, mode = 0;
  var BEST_KEYS = ["swipe-best", "swipe-best-w", "swipe-best-b"];
  try { mode = parseInt(localStorage.getItem("swipe-mode"), 10) || 0; } catch (e) {}
  if (mode < 0 || mode > 2) mode = 0;
  function loadBest() { best = 0; try { best = parseInt(localStorage.getItem(BEST_KEYS[mode]), 10) || 0; } catch (e) {} }
  function applyMode() {
    document.body.classList.remove("m0", "m1", "m2");
    document.body.classList.add("m" + mode);
    loadBest(); showBest();
  }
  // Haptik: Android per Vibration API, iPhone nur über den versteckten Schalter (kurzes Ticken)
  var hapSw = document.getElementById("hapsw"), hapLabel = hapSw.parentNode;
  function tick() { try { hapLabel.click(); } catch (e) {} }
  function buzz(long) {
    if (mode === 0) return;
    if (typeof navigator.vibrate === "function") { try { navigator.vibrate(long ? 350 : 12); } catch (e) {} return; }
    tick();
    if (long) { setTimeout(tick, 70); setTimeout(tick, 140); setTimeout(tick, 210); setTimeout(tick, 280); }
  }
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best : "--"); }
  
  function later(fn, ms) { var g = gen; setTimeout(function () { if (g === gen) fn(); }, ms); }
  function setDir(b, d) {
    b.dir = d;
    b.svg.style.setProperty("--rot", ROT[d] + "deg");
    b.el.setAttribute("aria-label", "Pfeil " + d);
  }
  function randDir() { return DIRS[Math.floor(Math.random() * 4)]; }
  function shuffle(a) { a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }

  function idle() {
    gen++;
    state = "idle";
    score = 0;
    scoreEl.textContent = "0";
    resultEl.hidden = true;
    var f = shuffle(FACTORS);
    boxes.forEach(function (b, k) {
      b.val = 1; b.shown = 1; b.factor = f[k];
      b.el.classList.remove("low", "miss", "pop");
      setDir(b, randDir());
    });
    draw();
    document.body.classList.add("idle");
  }
  function start() {
    state = "run";
    last = performance.now();
    document.body.classList.remove("idle");
  }
  function finish() {
    state = "done";
    var rec = score > best;
    if (rec) {
      best = score;
      try { localStorage.setItem(BEST_KEYS[mode], String(best)); } catch (e) {}
      showBest();
    }
    recEl.hidden = !rec;
    later(function () { ptsEl.textContent = score + " Pts"; resultEl.hidden = false; }, 600);
  }

  function swipe(b, d) {
    if (state !== "run") return;
    if (d === b.dir) {
      score++;
      scoreEl.textContent = score;
      b.val = Math.min(1, b.val + REFILL);
      setDir(b, randDir());
      b.el.classList.remove("pop");
      void b.el.offsetWidth;
      b.el.classList.add("pop");
      buzz(false);
    } else {
      b.el.classList.add("miss");
      buzz(true);
      if (mode === 2) { finish(); return; }
      var g = gen;
      setTimeout(function () { if (g === gen) b.el.classList.remove("miss"); }, mode ? 260 : 140);
    }
  }

  function draw() {
    boxes.forEach(function (b) {
      b.fill.style.transform = "scaleX(" + Math.max(0, b.shown) + ")";
      var low = b.shown < LOW;
      if (low !== b.low) { b.low = low; b.el.classList.toggle("low", low); }
    });
  }

  function frame(t) {
    var dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    if (state === "run") {
      var rate = BASE + PER_POINT * score;
      for (var k = 0; k < 4; k++) {
        var b = boxes[k];
        b.val -= b.factor * rate * dt;
        if (b.val <= 0) { b.val = 0; b.shown = 0; draw(); finish(); break; }
      }
    }
    // Auffüllen kurz animiert, Leeren direkt
    boxes.forEach(function (b) {
      if (b.shown < b.val) b.shown = Math.min(b.val, b.shown + dt * 2.2);
      else b.shown = b.val;
    });
    if (state !== "done") draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function (t) { last = t; frame(t); });

  // Wischen: Start auf einer Box, Richtung sobald die Bewegung weit genug ist
  var touches = {};
  boxes.forEach(function (b) {
    b.el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (state === "idle") start();
      touches[e.pointerId] = { b: b, x: e.clientX, y: e.clientY, done: false };
      try { b.el.setPointerCapture(e.pointerId); } catch (err) {}
    });
  });
  document.addEventListener("pointermove", function (e) {
    var s = touches[e.pointerId];
    if (!s || s.done) return;
    var dx = e.clientX - s.x, dy = e.clientY - s.y;
    var th = Math.max(18, grid.offsetWidth * 0.045);
    if (dx * dx + dy * dy < th * th) return;
    s.done = true;
    var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    swipe(s.b, d);
  });
  function endTouch(e) { delete touches[e.pointerId]; }
  document.addEventListener("pointerup", endTouch);
  document.addEventListener("pointercancel", endTouch);

  document.addEventListener("pointerdown", function (e) {
    if (state !== "idle") return;
    if (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest(".modebox")) return;
    e.preventDefault();
    start();
  });
  // Tastatur zum Testen: Pfeiltasten wirken auf die Box mit dem knappsten Balken
  document.addEventListener("keydown", function (e) {
    var map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    if (!map[e.key]) return;
    e.preventDefault();
    if (state === "idle") start();
    var target = null;
    boxes.forEach(function (b) { if (b.dir === map[e.key] && (!target || b.val < target.val)) target = b; });
    swipe(target || boxes[0], map[e.key]);
  });

  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("ok"), idle);

  document.getElementById("mode").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  bindTap(document.getElementById("mode"), function () {
    mode = (mode + 1) % 3;
    try { localStorage.setItem("swipe-mode", String(mode)); } catch (e) {}
    applyMode();
    idle();
    buzz(false);
  });

  applyMode();
  idle();
  window.__swipe = { get s() { return { state: state, score: score, vals: boxes.map(function (b) { return +b.val.toFixed(3); }), dirs: boxes.map(function (b) { return b.dir; }) }; } };
})();
</script>

</body></html>
