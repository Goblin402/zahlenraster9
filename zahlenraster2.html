<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Zahlenraster 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Layout: Timer bei ~31% Höhe, 4x4-Raster bei ~46%, Maße wie auf dem Foto. Bewusst nur dunkles Design. */
:root {
  --bg: #050505;
  --cream: #fff0b0;
  --pill: #fbb02d;
  --pill-ink: #3a2400;
  --font: "Syne", "Arial Black", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font);
  font-weight: 800;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.bar {
  position: absolute;
  top: 12px;
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  gap: 8px;
  align-items: center;
}
.bar button, .best {
  background: #1c1c1c;
  color: var(--cream);
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.95em;
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.timer {
  position: absolute;
  left: 0; right: 0;
  top: 29%;
  text-align: center;
  font-size: clamp(34px, 10.5vw, 60px);
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
.again {
  position: absolute;
  left: 50%;
  top: 21%;
  transform: translateX(-50%);
  background: var(--pill);
  color: var(--pill-ink);
  border: 0;
  border-radius: 999px;
  padding: 0.55em 1.3em;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.again:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
.again.rs { background: #1c1c1c; color: var(--cream); }
.again:active { transform: translateX(-50%) scale(0.94); }
.bar button.auto {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid var(--cream);
  border-radius: 7px;
  background: transparent;
  opacity: 0.55;
  margin-right: 4px;
}
.bar button.auto[aria-pressed="true"] { background: var(--cream); opacity: 1; }
.grid {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translateX(-50%);
  width: min(78vw, 420px, 52vh);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2.5%;
}
.tile {
  aspect-ratio: 1;
  border: 0;
  border-radius: 9%;
  padding: 0;
  font: inherit;
  font-size: clamp(22px, 7.6vw, 38px);
  color: var(--cream);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.06s, opacity 0.1s;
}
.tile:active { transform: scale(0.93); }
.tile.done { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

<div class="bar">
  <button id="auto" class="auto" type="button" aria-pressed="false" aria-label="Nach dem Schaffen automatisch neu starten"></button>
  <div class="best" id="best">Best --</div>
</div>
<div class="timer" id="timer" aria-live="off">0.0s</div>
<button class="again rs" id="again" type="button">&#8635; Reset</button>
<div class="grid" id="grid"></div>

<script>
(function () {
  // Feste Anordnung wie auf dem Foto, Farben pro Kachel
  var layout = [
    [4, "#b2dfd1"], [1, "#ff1530"], [14, "#8d98ff"], [10, "#ff3a08"],
    [12, "#ffa100"], [13, "#a31fb0"], [2, "#c60fa4"], [8, "#b7cc00"],
    [5, "#8ab52a"], [15, "#ff2014"], [7, "#ff1a14"], [9, "#8c1ccc"],
    [11, "#73a5f4"], [6, "#ff6a00"], [3, "#a4adff"], [16, "#afbe17"]
  ];
  var grid = document.getElementById("grid");
  var timerEl = document.getElementById("timer");
  var againBtn = document.getElementById("again");
  var tiles = {};
  var bestEl = document.getElementById("best");
  var autoBtn = document.getElementById("auto");
  var auto = false;
  try { auto = localStorage.getItem("zr2-auto") === "1"; } catch (e) {}
  autoBtn.setAttribute("aria-pressed", auto ? "true" : "false");
  autoBtn.addEventListener("click", function (e) {
    e.preventDefault();
    auto = !auto;
    autoBtn.setAttribute("aria-pressed", auto ? "true" : "false");
    try { localStorage.setItem("zr2-auto", auto ? "1" : "0"); } catch (e2) {}
  });
  // Ein Button an der Stelle von "Nochmal": sonst "Reset", nach dem Schaffen "Nochmal"
  function setAgain(fin) {
    againBtn.classList.toggle("rs", !fin);
    againBtn.innerHTML = fin ? "Nochmal" : "&#8635; Reset";
  }
  var next = 1, start = 0, raf = 0, running = false, best = null;
  try { var s = parseFloat(localStorage.getItem("zr2-best")); if (s > 0) best = s; } catch (e) {}
  function showBest() { bestEl.textContent = "Best " + (best ? (best / 1000).toFixed(2) + "s" : "--"); }
  showBest();

  layout.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tile";
    b.textContent = t[0];
    b.style.background = t[1];
    b.setAttribute("aria-label", String(t[0]));
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); tap(t[0]); });
    grid.appendChild(b);
    tiles[t[0]] = b;
  });

  function fmt(ms, d) { return (ms / 1000).toFixed(d) + "s"; }
  function tick() {
    timerEl.textContent = fmt(performance.now() - start, 1);
    raf = requestAnimationFrame(tick);
  }
  function tap(n) {
    if (n !== next) return;
    if (n === 1) {
      start = performance.now();
      running = true;
      raf = requestAnimationFrame(tick);
    }
    tiles[n].classList.add("done");
    next++;
    if (n === 16) {
      cancelAnimationFrame(raf);
      running = false;
      var t = performance.now() - start;
      timerEl.textContent = fmt(t, 2);
      setAgain(true);
      if (!best || t < best) {
        best = t;
        try { localStorage.setItem("zr2-best", String(t)); } catch (e) {}
        showBest();
      }
      if (auto) reset(true);
    }
  }
  function reset(keep) {
    cancelAnimationFrame(raf);
    running = false;
    next = 1;
    if (!keep) timerEl.textContent = "0.0s";
    setAgain(false);
    Object.keys(tiles).forEach(function (k) { tiles[k].classList.remove("done"); });
  }
  againBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); reset(); });
  againBtn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reset(); } });
  timerEl.addEventListener("pointerdown", function () { if (!running) reset(); });
})();
</script>

</body></html>
