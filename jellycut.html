<style>
/* Jelly Cut: 3 Runden (Hälfte 50 %, Drittel 33 %, Viertel 25 %). Gerade Linie durch das Jelly ziehen, beim Loslassen wird geschnitten.
   Genauigkeit pro Runde = 100 % * (1 - |Anteil - Ziel| / Ziel), gewertet wird das Stück, das näher am Ziel liegt (gelb).
   Ergebnis = Durchschnitt der 3 Runden (Original: 28,1 % beim Drittel -> 84,4 %).
   Maße (390 x 844): Titel 204–299 px, Ziel-% bei 324 px, Jelly-Mitte (195 | 503), etwa 290 x 270 px, Schatten bei ~700 px. */

.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result { position: absolute; inset: 0; z-index: 7; background: rgba(30, 6, 20, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.result[hidden], .rec[hidden] { display: none; }
.sum { background: #2a1426; border-radius: 16px; padding: 14px 18px; min-width: 62vw; max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.sum div { display: flex; justify-content: space-between; font-size: 15px; padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,0.12); font-variant-numeric: tabular-nums; }
.sum div span:last-child { color: #ffd23f; }
.sum div.avg { border: 0; font-size: 15px; padding-top: 12px; align-items: baseline; }
.sum div.avg span:last-child { font-size: 26px; }

</style>

<script>
(function () {
  var ROUNDS = [{ t: 0.5, l1: "Schneide es in", l2: "zwei Hälften!", p: "50%", n: "Hälfte" },

                { t: 0.25, l1: "Schneide ein", l2: "Viertel ab!", p: "25%", n: "Viertel" }];

  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), Ws, Hs, S, dpr, OY;
  function layout() { dpr = Math.min(3, window.devicePixelRatio || 1); Ws = window.innerWidth; Hs = window.innerHeight; S = Ws / 390; OY = 0;

  function sx(x) { return x * S; } function sy(y) { return y / 844 * Hs; }

  showBest();

  // Zufällige Jelly-Form: weicher Klecks, eckiger Klecks oder Stern mit runden Spitzen, Rand leicht gewellt
  function makeShape() {
    var kind = Math.floor(Math.random() * 3), N = 260, pts = [], harm = [];
    for (var k = 2; k <= 5; k++) harm.push({ k: k, a: (Math.random() * 0.09) / (k * 0.5), p: Math.random() * 7 });
    var star = kind === 2 ? 5 : kind === 1 ? 4 : 0, sa = kind === 2 ? 0.26 : 0.11, sp = Math.random() * 7;
    var wob = [{ k: 9 + Math.floor(Math.random() * 5), a: 0.012 + Math.random() * 0.02, p: Math.random() * 7 }, { k: 15 + Math.floor(Math.random() * 6), a: 0.006 + Math.random() * 0.012, p: Math.random() * 7 }];

  }
  function nextRound() { round++; shape = makeShape(); pieces = null; state = "play"; }
  function cut(a, b) {

    if (A.length < 3 || B.length < 3) return false;
    var fa = Math.abs(area(A)) / ta, fb = 1 - fa;
    if (fa < 0.004 || fb < 0.004) return false;
    var tgt = ROUNDS[round].t, ea = Math.abs(fa - tgt), eb = Math.abs(fb - tgt);
    var pick = ea <= eb ? fa : fb, acc = Math.max(0, 100 * (1 - Math.abs(pick - tgt) / tgt));
    scores.push(acc);
    var len = Math.hypot(b[0] - a[0], b[1] - a[1]), nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
    pieces = [{ P: A, f: fa, dir: 1, yel: ea <= eb }, { P: B, f: fb, dir: -1, yel: ea > eb }];
    pieces.forEach(function (pc) { pc.c = centroid(pc.P); pc.nx = nx * pc.dir; pc.ny = ny * pc.dir; });
    pieces.line = [a, b]; state = "cut"; anim = 0;
    for (var i = 0; i < 40; i++) { var t = Math.random(), px = a[0] + (b[0] - a[0]) * t, py = a[1] + (b[1] - a[1]) * t;
      if (Math.hypot(px - CX, py - CY) < 150) conf.push({ x: px, y: py, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 260, c: ["#ffd23f", "#fff", "#7af0c6", "#ff9ec4"][i % 4], l: 1 }); }

    if (rec) { best = r2; try { localStorage.setItem("jellycut-best", String(best)); } catch (e) {} showBest(); }
    var h = ""; ROUNDS.forEach(function (R, i) { h += "<div><span>" + R.n + "</span><span>" + scores[i].toFixed(1) + "%</span></div>"; });

    ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.beginPath(); ctx.roundRect(0, sy(176), Ws, Hs, sx(22)); ctx.fill();

    if (state === "cut" && anim > 1.6 && round < 2) tAlpha = 0;
    ctx.globalAlpha = tAlpha; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.round(sx(38)) + "px " + font;
    ctx.lineWidth = sx(5); ctx.strokeStyle = "rgba(150,10,60,0.35)"; ctx.lineJoin = "round";
    [[R.l1, 228], [R.l2, 274]].forEach(function (l) { ctx.strokeText(l[0], Ws / 2, sy(l[1])); ctx.fillStyle = "#fff"; ctx.fillText(l[0], Ws / 2, sy(l[1])); });
    ctx.font = "800 " + Math.round(sx(22)) + "px " + font; ctx.fillStyle = "#ffd23f"; ctx.fillText(R.p, Ws / 2, sy(324));
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(150,0,50,0.28)"; ctx.beginPath(); ctx.ellipse(Ws / 2, sy(700), sx(122), sx(15), 0, 0, Math.PI * 2); ctx.fill();

    else {
      var k = Math.min(1, anim / 0.28), e = 1 - Math.pow(1 - k, 3), fade = state === "cut" && anim > 1.65 ? Math.max(0, 1 - (anim - 1.65) / 0.3) : 1;

      pieces.forEach(function (pc) { jelly(pc.P, pc.nx * 16 * e, pc.ny * 16 * e, pc.dir * 0.05 * e, pc.c, pc.yel); });
      ctx.font = "800 " + Math.round(sx(19)) + "px " + font; ctx.lineWidth = sx(4); ctx.strokeStyle = "rgba(0,60,40,0.55)";
      pieces.forEach(function (pc) { var t = (pc.f * 100).toFixed(1) + "%", x = sx(pc.c[0] + pc.nx * 16 * e), y = sy(pc.c[1] + pc.ny * 16 * e);

        ctx.globalAlpha = 1 - anim / 0.35; ctx.strokeStyle = "#ffe3ef"; ctx.lineWidth = sx(2.5); ctx.beginPath();

</script>

<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>

</body></html>
