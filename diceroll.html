<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>

<title>Dice Roll Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Layout: Handy-Bühne (Breite --w), alles in % der Bildschirmhöhe wie im Original: Zeit 29%, Würfel 39/51.5%, Eingabe 63%, Ziffernfeld ab 72%. Bewusst nur dunkles Design. */
:root {
  --bg: #17100f;
  --peach: #f7c9a0;
  --die: #ffd6a6;
  --die-side: #e9b886;
  --pip: #2a1612;
  --key: #3a282b;
  --key-line: #523b3e;
  --green: #b4e61c;
  --red: #f0605a;
  --chip: #2b1e1f;
  --font: "Syne", "Arial Black", system-ui, sans-serif;
  --w: min(100vw, 60vh);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--peach);
  font-family: var(--font);
  font-weight: 800;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.stage {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: var(--w);
  transform: translateX(-50%);
}
.bar {
  position: absolute;
  top: 12px;
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  z-index: 5;
}
.bar .row { display: flex; gap: 6px; align-items: center; }
.best b { font-weight: 800; opacity: 0.6; margin-right: 0.35em; }
.bar button.hard { background: #ff6a3d; color: #2a0d05; }
.bar button.on { background: #5db4ff; color: #06192b; }
.resetBtn {
  position: absolute;
  left: calc(var(--w) * 0.04);
  top: max(56px, calc(45.2% - var(--w) * 0.211 - 62px - 163px));
  height: 48px;
  padding: 0 1.4em;
  background: var(--chip);
  color: var(--peach);
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  z-index: 5;
}
.resetBtn:active { transform: scale(0.94); }
.replay {
  position: absolute;
  left: 50%;
  top: 45.2%;
  transform: translate(-50%, -50%);
  display: none;
  align-items: center;
  gap: 10px;
  height: 64px;
  padding: 0 1.6em;
  background: var(--chip);
  color: var(--peach);
  border: 1px solid var(--key-line);
  border-radius: 999px;
  font: inherit;
  font-size: 18px;
  cursor: pointer;
  z-index: 5;
}
.replay svg { width: 26px; height: 26px; }
.replay:active { transform: translate(-50%, -50%) scale(0.95); }
.replay:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
.hearing:not(.intro) .replay { display: inline-flex; }
.resetBtn:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
.bar button, .best {
  background: var(--chip);
  color: var(--peach);
  border: 0;
  border-radius: 999px;
  padding: 0.5em 0.8em;
  font: inherit;
  font-size: 13px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.bar button { cursor: pointer; }
.bar button:active { transform: scale(0.94); }
.bar button:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }

.timer {
  position: absolute;
  left: 0; right: 0;
  top: 29%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.085);
  font-variant-numeric: tabular-nums;
  transition: opacity 0.3s;
}
.dots {
  position: absolute;
  left: 50%;
  top: 32.3%;
  transform: translate(-50%, -50%);
  display: flex;
  gap: calc(var(--w) * 0.012);
  transition: opacity 0.3s;
}
.dots i {
  width: calc(var(--w) * 0.016);
  height: calc(var(--w) * 0.016);
  border-radius: 50%;
  background: var(--peach);
  opacity: 0.3;
  transition: opacity 0.2s;
}
.dots i.on { opacity: 1; }
.intro .timer { opacity: 0.45; }
.intro .dots { opacity: 0; }

.hint {
  position: absolute;
  left: 0; right: 0;
  top: 56%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.062);
  line-height: 1.12;
  opacity: 0;
  transition: opacity 0.25s;
}
.intro .hint { opacity: 1; }

.dice {
  position: absolute;
  left: 50%;
  top: 45.2%;
  transform: translate(-50%, -50%);
  display: grid;
  grid-template-columns: repeat(2, var(--s));
  column-gap: calc(var(--w) * 0.088);
  row-gap: calc(var(--w) * 0.087);
  --s: calc(var(--w) * 0.167);
  perspective: calc(var(--w) * 1.6);
  transition: opacity 0.15s;
}
.intro .dice { opacity: 0; }
.die { width: var(--s); height: var(--s); }
.cube {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(0.18, 0.7, 0.24, 1);
}
.cube.snap { transition: none; }
.face {
  position: absolute;
  inset: 0;
  background: var(--die);
  border-radius: 15%;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 13%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.face.side { background: var(--die); transition: background-color 0.2s; }
.rolling .face.side { background: var(--die-side); }
.face b {
  width: 78%;
  height: 78%;
  place-self: center;
  border-radius: 50%;
  background: var(--pip);
}

.entry {
  position: absolute;
  left: 0; right: 0;
  top: 63.2%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.105);
  color: var(--peach);
  font-variant-numeric: tabular-nums;
  transition: color 0.18s, opacity 0.2s;
  min-height: 1em;
}
.entry.ok { color: var(--green); }
.entry.bad { color: var(--red); }
.entry.fade { opacity: 0; }

.pad {
  position: absolute;
  left: 50%;
  top: 68.8%;
  transform: translateX(-50%);
  width: calc(var(--w) * 0.81);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: calc(100vh * 0.059);
  gap: calc(100vh * 0.011) calc(var(--w) * 0.022);
}
@supports (height: 100dvh) { .pad { grid-auto-rows: 5.9dvh; gap: 1.1dvh calc(var(--w) * 0.022); } }
.key {
  border: 1px solid var(--key-line);
  background: var(--key);
  color: var(--peach);
  border-radius: calc(var(--w) * 0.03);
  font: inherit;
  font-size: calc(var(--w) * 0.058);
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  transition: background-color 0.25s, border-color 0.25s, opacity 0.25s, transform 0.05s;
}
.key:active { transform: scale(0.95); background: var(--key-line); }
.key.blank { visibility: hidden; }
.key svg { width: 38%; height: 50%; }
.intro .key { background: transparent; border-color: transparent; opacity: 0.55; }

.result {
  position: absolute;
  inset: 0;
  background: rgba(10, 6, 6, 0.93);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  z-index: 4;
}
.result[hidden], .rec[hidden], .go[hidden] { display: none; }
.go {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  width: calc(var(--w) * 0.81);
  padding: 0.85em 0;
  background: #fbb02d;
  color: #3a2400;
  border: 0;
  border-radius: 14px;
  box-shadow: 0 5px 0 #c98410;
  font: inherit;
  font-size: 18px;
  letter-spacing: 0.04em;
  cursor: pointer;
  z-index: 3;
}
.go:active { transform: translate(-50%, calc(-50% + 3px)); box-shadow: 0 2px 0 #c98410; }
.go:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
.result h2 { margin: 0; font-size: calc(var(--w) * 0.075); text-transform: uppercase; color: var(--peach); }
.result .lbl { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
.result .big { font-size: calc(var(--w) * 0.13); font-variant-numeric: tabular-nums; }
.result .rec { color: var(--green); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button {
  margin-top: 8px;
  background: var(--green);
  color: #1d2600;
  border: 0;
  border-radius: 999px;
  padding: 0.7em 1.8em;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}
.result button:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .cube { transition-duration: 0.3s; } }

.numdisp {
  position: absolute;
  left: 0; right: 0;
  top: 45.2%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--w) * 0.25);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  display: none;
  transition: opacity 0.15s;
}
.mode-num .numdisp, .mode-pairs .numdisp { display: block; }
.mode-num .dice, .mode-pairs .dice { display: none; }
.mode-pairs .numdisp { font-size: calc(var(--w) * 0.17); line-height: 1.12; }
.numdisp div { min-height: 1em; }
.bar button.locked { opacity: 0.45; cursor: default; }
.mode-2die .die:nth-child(n+3) { display: none; }
.intro .numdisp { opacity: 0; }
.result .avg { font-size: calc(var(--w) * 0.13); font-variant-numeric: tabular-nums; }
.result .sub { font-size: 14px; opacity: 0.75; font-variant-numeric: tabular-nums; }
@media (max-width: 360px) { .bar button, .best { font-size: 12px; padding: 0.5em 0.65em; } }
</style>
<div class="bar">
  <div class="row">
    <button id="modeBtn" type="button" aria-label="Modus wechseln">4dice</button>
    <button id="roundsBtn" type="button" aria-label="Anzahl Runden wechseln">10&times;</button>
    <button id="diffBtn" type="button" aria-label="Schwierigkeit wechseln">real</button>
  </div>
  <div class="row">
    <button id="hearBtn" type="button" aria-label="Zahlen sehen oder hören">sehen</button>
    <div class="best" id="best">Best --</div>
  </div>
</div>

<div class="stage intro mode-4dice" id="stage">
  <div class="timer" id="timer">0.0</div>
  <div class="dots" id="dots"></div>
  <div class="hint">Zähle alle<br>Augenpunkte!</div>
  <div class="dice" id="dice"></div>
  <div class="numdisp" id="numdisp"></div>
  <div class="entry" id="entry"></div>
  <div class="pad" id="pad"></div>
  <button class="resetBtn" id="reset" type="button">&#8635; Reset</button>
  <button class="replay" id="replay" type="button" aria-label="Nochmal hören"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Nochmal</button>
</div>

<div class="result" id="result" hidden>
  <h2>Übung fertig!</h2>
  <div class="lbl" id="resLbl">Ø pro Runde</div>

  <div class="rec" id="resRec" hidden>Neue Bestzeit</div>
  <button id="again" type="button">&#8635; Nochmal</button>
</div>
<script>
(function () {
  var INTRO_MS = 0, ROLL_MS = 1050, NUM_MS = 250, CORRECT_MS = 750, WRONG_MS = 350;

  var stage = document.getElementById("stage");
  var timerEl = document.getElementById("timer");
  var dotsEl = document.getElementById("dots");
  var numEl = document.getElementById("numdisp");
  var modeBtn = document.getElementById("modeBtn");
  var diffBtn = document.getElementById("diffBtn");
  var hearBtn = document.getElementById("hearBtn");
  var roundsBtn = document.getElementById("roundsBtn");
  var resAvg = document.getElementById("resAvg");
  var resTotal = document.getElementById("resTotal");
  var resLbl = document.getElementById("resLbl");
  var dotEls = [];
  var diceEl = document.getElementById("dice");
  var entryEl = document.getElementById("entry");
  var padEl = document.getElementById("pad");
  var bestEl = document.getElementById("best");
  var resultEl = document.getElementById("result");
  var resRec = document.getElementById("resRec");

  // Pip-Positionen im 3x3-Raster (Zeile, Spalte); 2 und 3 laufen von unten links nach oben rechts
  var PIPS = {
    1: [[1,1]],
    2: [[0,2],[2,0]],
    3: [[0,2],[1,1],[2,0]],
    4: [[0,0],[0,2],[2,0],[2,2]],
    5: [[0,0],[0,2],[1,1],[2,0],[2,2]],
    6: [[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]]
  };
  // Welche Würfelseite wo sitzt und welche Drehung (X, Y) sie nach vorne bringt
  var FACES = [
    { v: 1, t: "", show: [0, 0] },
    { v: 6, t: "rotateY(180deg)", show: [0, 180] },
    { v: 3, t: "rotateY(90deg)", show: [0, -90] },
    { v: 4, t: "rotateY(-90deg)", show: [0, 90] },
    { v: 2, t: "rotateX(90deg)", show: [-90, 0] },
    { v: 5, t: "rotateX(-90deg)", show: [90, 0] }
  ];
  var SHOW = {}; FACES.forEach(function (f) { SHOW[f.v] = f.show; });

  var cubes = [];
  for (var i = 0; i < 4; i++) {
    var die = document.createElement("div");
    die.className = "die";
    var cube = document.createElement("div");
    cube.className = "cube";
    FACES.forEach(function (f, idx) {
      var face = document.createElement("div");
      face.className = "face" + (idx > 1 ? " side" : "");
      face.style.transform = f.t + " translateZ(calc(var(--s) / 2))";
      PIPS[f.v].forEach(function (p) {
        var b = document.createElement("b");
        b.style.gridRow = p[0] + 1;
        b.style.gridColumn = p[1] + 1;
        face.appendChild(b);
      });
      cube.appendChild(face);
    });
    die.appendChild(cube);
    diceEl.appendChild(die);
    cubes.push({ el: cube, x: 0, y: 0, z: 0 });
  }

  // Ziffernfeld: 1-9, dann leer / 0 / Löschen
  var keys = [1,2,3,4,5,6,7,8,9,"",0,"del"];
  keys.forEach(function (k) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "key";
    if (k === "") { b.className += " blank"; b.tabIndex = -1; }
    else if (k === "del") {
      b.setAttribute("aria-label", "Löschen");
      b.innerHTML = '<svg viewBox="0 0 24 18" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 1h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8L1 9z"/><path d="M12 6l6 6M18 6l-6 6"/></svg>';
    } else b.textContent = k;
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); press(k); });
    padEl.appendChild(b);
  });

  var MODES = ["4dice", "2die", "num", "pairs"];
  var LABEL = { "4dice": "4dice", "2die": "2die", "num": "num", "pairs": "2+2" };
  var ROUND_OPTS = [3, 5, 10, 20];
  var mode = "4dice", rounds = 10, hard = false, hear = false, lastNum = 0, lastPair = "", lastGroup = -1;
  try {
    var m = localStorage.getItem("dr-mode"); if (MODES.indexOf(m) >= 0) mode = m;
    var r = parseInt(localStorage.getItem("dr-rounds"), 10); if (ROUND_OPTS.indexOf(r) >= 0) rounds = r;
    hard = localStorage.getItem("dr-diff") === "hard";
    hear = localStorage.getItem("dr-hear") === "1";
  } catch (e) {}

  var state = "idle", round = 0, sum = 0, input = "", deck = [];
  var elapsed = 0, segStart = 0, raf = 0, gen = 0, best = null;

  // ---- Vorlesen mit der Apple-Stimme (wie beim Kicker Timer)
  // iOS gibt Sprache nur frei, wenn speak() direkt aus einem "click" kommt (nicht pointerdown).
  // Nie direkt nach cancel() sprechen, vorher resume() aufrufen.
  var SPEAK_RATE = 1.3;
  var synth = window.speechSynthesis || null;
  var lastCancel = 0;
  var WORDS = { 2: "zwei", 3: "drei", 4: "vier", 5: "fünf", 6: "sechs", 7: "sieben", 8: "acht", 9: "neun",
    10: "zehn", 11: "elf", 12: "zwölf", 13: "dreizehn", 14: "vierzehn", 15: "fünfzehn", 16: "sechzehn",
    17: "siebzehn", 18: "achtzehn", 19: "neunzehn", 20: "zwanzig", 21: "einundzwanzig", 22: "zweiundzwanzig",
    23: "dreiundzwanzig", 24: "vierundzwanzig" };
  function germanVoice() {
    if (!synth) return null;
    var vs = synth.getVoices() || [];
    var de = vs.filter(function (x) { return x.lang && x.lang.replace("_", "-").toLowerCase().indexOf("de") === 0; });
    if (!de.length) return null;
    var dede = de.filter(function (x) { return x.lang.replace("_", "-").toLowerCase() === "de-de"; });
    var pool = dede.length ? dede : de;
    // bessere Stimmen bevorzugen (Premium/Erweitert), sonst Anna, sonst die erste deutsche
    var good = pool.filter(function (x) { return /premium|erweitert|enhanced|siri/i.test(x.name); })[0];
    var anna = pool.filter(function (x) { return /anna/i.test(x.name); })[0];
    return good || anna || pool[0];
  }
  if (synth) { try { synth.getVoices(); } catch (e) {} }
  function say(text) {
    if (!synth) return;
    var go = function () {
      try {
        if (synth.paused) synth.resume();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE"; u.rate = SPEAK_RATE; u.pitch = 1; u.volume = 1;
        var v = germanVoice(); if (v) u.voice = v;
        synth.speak(u);
      } catch (e) {}
    };
    try {
      if (synth.paused) synth.resume();
      if (synth.speaking || synth.pending) { synth.cancel(); lastCancel = Date.now(); setTimeout(go, 120); }
      else if (Date.now() - lastCancel < 200) setTimeout(go, 200 - (Date.now() - lastCancel));
      else go();
    } catch (e) { go(); }
  }
  function stopAudio() {
    if (!synth) return;
    try { if (synth.speaking || synth.pending) { synth.cancel(); lastCancel = Date.now(); } } catch (e) {}
  }
  // num: "vierzehn"; 2+2: "dreizehn vier" (kein "plus"/"und", kurze Pause)
  var lastSpoken = null;
  function speakNow(list) { lastSpoken = list; say(list.map(function (n) { return WORDS[n] || String(n); }).join(" ")); }
  function canHear() { return !!synth && (mode === "num" || mode === "pairs"); }
  function hearOn() { return hear && canHear(); }
  function roundCount() { return mode === "4dice" ? 3 : rounds; }
  function bestKey() { return (mode === "4dice" ? "dr-total-4dice" : "dr-avg-" + mode) + (hard ? "-hard" : "") + (hearOn() ? "-hear" : ""); }
  function loadBest() {
    best = null;
    try { var s = parseFloat(localStorage.getItem(bestKey())); if (s > 0) best = s; } catch (e) {}
  }
  function showBest() { bestEl.innerHTML = "<b>Best " + (mode === "4dice" ? "&Sigma;" : "&Oslash;") + "</b>" + (best ? (best / 1000).toFixed(2) + "s" : "--"); }

  function later(fn, ms) { var g = gen; setTimeout(function () { if (g === gen) fn(); }, ms); }
  function now() { return state === "play" ? elapsed + (performance.now() - segStart) : elapsed; }
  function drawTimer() { timerEl.textContent = (now() / 1000).toFixed(1); }
  function tick() { drawTimer(); raf = requestAnimationFrame(tick); }
  function drawDots() { dotEls.forEach(function (d, i) { d.classList.toggle("on", i < round); }); }
  function buildDots() {
    dotsEl.innerHTML = "";
    dotEls = [];
    for (var i = 0; i < roundCount(); i++) { var d = document.createElement("i"); dotsEl.appendChild(d); dotEls.push(d); }
  }
  function setEntry(txt, cls) { entryEl.textContent = txt; entryEl.className = "entry" + (cls ? " " + cls : ""); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  // ---- Schwierigkeit: Note d in 0..1 pro Aufgabe. Im Modus "hart" bleibt eine Runde mit
  // Wahrscheinlichkeit FLOOR + (1 - FLOOR) * d, sonst wird neu gewürfelt.
  var FLOOR = 0.2;
  function keep(d) { return !hard || Math.random() < FLOOR + (1 - FLOOR) * d; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  // num: Tipp-Schwierigkeit (14 und 17 liegen beide in der linken Spalte, Einstellige sind leicht)
  var D_NUM = { 4: .2, 5: .2, 6: .2, 7: .25, 8: .2, 9: .2, 10: .4, 11: .25, 12: .5, 13: .55, 14: 1, 15: .65,
                16: .7, 17: 1, 18: .7, 19: .75, 20: .5, 21: .55, 22: .3, 23: .4, 24: .7 };
  function groupOf(n) { return n < 10 ? 0 : n < 20 ? 1 : 2; }

  // 2+2: Kopfrechnen (10+x ist leicht, 11+x deutlich schwerer, krumme Zahlen über die 10 am schwersten)
  function dPair(a, b) {
    var lo = Math.min(a, b), hi = Math.max(a, b);
    if (hi === 10 || lo === 10) return 0.05;
    if (lo === 2) return 0.2;
    if (hi === 12) return 0.4;
    if (hi === 11) return 0.65 + 0.35 * clamp01((lo - 3) / 6);
    var sm = lo + hi;
    if (sm <= 9) return 0.25;
    if (sm === 10) return 0.3;
    return 0.55 + 0.45 * clamp01((lo - 3) / 6);
  }

  // 2die: große, verschiedene Augen sind schwerer
  function d2(a, b) {
    var d = 0.15 + 0.6 * (a + b - 2) / 10;
    if (a !== b && a + b !== 10) d += 0.15;
    return clamp01(d);
  }

  // 4dice: viele verschiedene hohe Werte ohne 10er-Paare sind schwer, Einsen und Doppelte leicht
  function d4(v) {
    var sum = 0, ones = 0, seen = {}, u = 0, ten = false, dbl = false, i, j;
    for (i = 0; i < v.length; i++) {
      sum += v[i];
      if (v[i] === 1) ones++;
      if (!seen[v[i]]) { seen[v[i]] = 1; u++; }
      for (j = i + 1; j < v.length; j++) {
        if (v[i] + v[j] === 10) ten = true;
        if (v[i] === v[j]) dbl = true;
      }
    }
    return clamp01(0.3 + 0.3 * (sum - 4) / 20 + 0.12 * (u - 1) - 0.12 * ones - (ten ? 0.15 : 0) - (dbl ? 0.1 : 0));
  }

  function newDeck() {
    // Alle 36 Paare ohne Wiederholung; im Modus "hart" werden schwere Paare früher gezogen
    var pool = [], w = [];
    deck = [];
    for (var a = 1; a <= 6; a++) for (var b = 1; b <= 6; b++) { pool.push([a, b]); w.push(hard ? FLOOR + (1 - FLOOR) * d2(a, b) : 1); }
    while (pool.length) {
      var tot = 0, i;
      for (i = 0; i < w.length; i++) tot += w[i];
      var r = Math.random() * tot;
      for (i = 0; i < w.length - 1; i++) { r -= w[i]; if (r < 0) break; }
      deck.push(pool.splice(i, 1)[0]);
      w.splice(i, 1);
    }
  }

  function applyMode() {
    stage.className = stage.className.replace(/\bmode-\S+/g, "").trim() + " mode-" + mode;
    modeBtn.textContent = LABEL[mode];
    diffBtn.textContent = hard ? "hart" : "real";
    diffBtn.classList.toggle("hard", hard);
    hearBtn.textContent = hearOn() ? "hören" : "sehen";
    hearBtn.classList.toggle("on", hearOn());
    hearBtn.classList.toggle("locked", !canHear());
    stage.classList.toggle("hearing", hearOn());
    roundsBtn.innerHTML = roundCount() + "&times;";
    roundsBtn.classList.toggle("locked", mode === "4dice");
    loadBest();
    showBest();
    buildDots();
  }

  function startPlay() {
    diceEl.classList.remove("rolling");
    setEntry("");
    input = "";
    state = "play";
    segStart = performance.now();
  }

  function roll() {
    state = "roll";
    round++;
    drawDots();
    if (mode === "num") {
      var tries = 0, g;
      do {
        sum = rnd(1, 6) + rnd(1, 6) + rnd(1, 6) + rnd(1, 6);
        g = groupOf(sum);
        // Gleiche Zahl nie zweimal hintereinander; gleicher Zahlenbereich wie zuvor ist leichter
        var dn = D_NUM[sum] * (g === lastGroup ? 0.7 : 1);
        var okn = sum !== lastNum && keep(dn);
      } while (!okn && ++tries < 500);
      lastNum = sum; lastGroup = g;
      if (hearOn()) { numEl.innerHTML = ""; speakNow([sum]); later(startPlay, 0); return; }
      numEl.innerHTML = "<div>" + sum + "</div>";
      later(startPlay, NUM_MS);
      return;
    }
    if (mode === "pairs") {
      var pa, pb, key, tries2 = 0;
      do {
        pa = rnd(1, 6) + rnd(1, 6); pb = rnd(1, 6) + rnd(1, 6);
        key = Math.min(pa, pb) + "-" + Math.max(pa, pb);
      } while ((key === lastPair || !keep(dPair(pa, pb))) && ++tries2 < 500);
      lastPair = key;
      sum = pa + pb;
      if (hearOn()) { numEl.innerHTML = ""; speakNow([pa, pb]); later(startPlay, 0); return; }
      numEl.innerHTML = "<div>" + pa + "</div><div>" + pb + "</div>";
      later(startPlay, NUM_MS);
      return;
    }
    diceEl.classList.add("rolling");
    var vals;
    if (mode === "2die") vals = deck[round - 1];
    else {
      var tries3 = 0;
      do { vals = [rnd(1, 6), rnd(1, 6), rnd(1, 6), rnd(1, 6)]; } while (!keep(d4(vals)) && ++tries3 < 500);
    }
    sum = 0;
    cubes.forEach(function (c, ci) {
      if (ci >= vals.length) return;
      var v = vals[ci]; sum += v;
      var t = SHOW[v];
      c.x = t[0] + 360 * Math.ceil((c.x - t[0]) / 360) + 360 * rnd(1, 2);
      c.y = t[1] + 360 * Math.ceil((c.y - t[1]) / 360) + 360 * rnd(1, 2);
      c.z = c.z + 360 * (Math.random() < 0.5 ? -1 : 1);
      c.el.style.transform = "rotateZ(" + c.z + "deg) rotateX(" + c.x + "deg) rotateY(" + c.y + "deg)";
    });
    later(startPlay, ROLL_MS);
  }

  function press(k) {
    if (state !== "play") return;
    if (k === "") return;
    if (k === "del") { input = input.slice(0, -1); setEntry(input); return; }
    var target = String(sum);
    if (input.length >= target.length) return;
    input += k;
    if (input === target) {
      elapsed += performance.now() - segStart;
      state = "correct";
      setEntry(input, "ok");
      drawTimer();
      if (round >= roundCount()) { later(finish, 500); }
      else {
        later(function () { entryEl.classList.add("fade"); roll(); }, CORRECT_MS);
      }
    } else if (input.length >= target.length) {
      state = "wrong";
      setEntry(input, "bad");
      later(function () { input = ""; setEntry(""); state = "play"; }, WRONG_MS);
    } else {
      setEntry(input);
    }
  }

  function finish() {
    state = "done";
    cancelAnimationFrame(raf);
    var total = elapsed, avg = total / roundCount();
    timerEl.textContent = (total / 1000).toFixed(1);
    var four = mode === "4dice";
    var score = four ? total : avg;
    var rec = !best || score < best;
    if (rec) {
      best = score;
      try { localStorage.setItem(bestKey(), String(score)); } catch (e) {}
      showBest();
    }
    resRec.hidden = !rec;
    resLbl.textContent = four ? "Gesamtzeit" : "Ø pro Runde";
    resTotal.textContent = four ? "Ø pro Runde " + (avg / 1000).toFixed(2) + "s" : "";
    resultEl.hidden = false;
    var t0 = performance.now(), g = gen;
    (function count() {
      if (g !== gen) return;
      var p = Math.min(1, (performance.now() - t0) / 600);
      resAvg.textContent = (score * p / 1000).toFixed(2) + "s";
      if (p < 1) requestAnimationFrame(count);
    })();
    document.getElementById("again").focus({ preventScroll: true });
  }

  function idle() {
    gen++;
    stopAudio();
    cancelAnimationFrame(raf);
    state = "idle";
    round = 0; elapsed = 0; input = "";
    lastNum = 0; lastPair = ""; lastGroup = -1;
    resultEl.hidden = true;
    setEntry("");
    numEl.innerHTML = "";
    diceEl.classList.remove("rolling");
    drawDots();
    timerEl.textContent = "0.0";
    stage.classList.add("intro");
  }
  function start() {
    if (state !== "idle") return;
    state = "intro";
    if (mode === "2die") newDeck();
    var go = function () {
      stage.classList.remove("intro");
      raf = requestAnimationFrame(tick);
      roll();
    };
    if (hearOn()) { say("Los"); later(go, 650); }
    else later(go, INTRO_MS);
  }

  function bindTap(el, fn) {
    // "click" statt pointerdown: nur so gibt iOS die Sprachausgabe frei
    el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
  }
  function save() { try { localStorage.setItem("dr-mode", mode); localStorage.setItem("dr-rounds", String(rounds)); localStorage.setItem("dr-diff", hard ? "hard" : "real"); localStorage.setItem("dr-hear", hear ? "1" : "0"); } catch (e) {} }
  bindTap(modeBtn, function () {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    save(); idle(); applyMode();
    if (synth) { try { if (synth.paused) synth.resume(); } catch (e) {} }
  });
  bindTap(roundsBtn, function () {
    if (mode === "4dice") return;
    rounds = ROUND_OPTS[(ROUND_OPTS.indexOf(rounds) + 1) % ROUND_OPTS.length];
    save(); idle(); applyMode();
  });
  bindTap(diffBtn, function () {
    hard = !hard;
    save(); idle(); applyMode();
  });
  bindTap(hearBtn, function () {
    if (!canHear()) return;
    hear = !hear;
    save(); idle(); applyMode();
    if (hearOn()) say("Hören an");
  });
  bindTap(document.getElementById("replay"), function () {
    if (lastSpoken && (state === "play" || state === "wrong" || state === "roll")) speakNow(lastSpoken);
  });
  bindTap(document.getElementById("reset"), idle);
  bindTap(document.getElementById("again"), idle);
  // Ausgegrauter Startbildschirm: Tippen irgendwo startet das Spiel
  stage.addEventListener("click", function (e) { if (state === "idle") { e.preventDefault(); start(); } });

  document.addEventListener("keydown", function (e) {
    if (/^[0-9]$/.test(e.key)) press(Number(e.key));
    else if (e.key === "Backspace") press("del");
  });

  applyMode();
  idle();
})();
</script>

</body></html>
