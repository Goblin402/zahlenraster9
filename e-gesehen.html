<script>
/* Gemeinsames Gerüst der eigenen Spiele: Reset/Best oben rechts, Punkte, Leben, Zeitbalken, Start-Hinweis, Ergebnis, Töne.

  }
  function init(opts) {
    o = opts; if (!o.fmt) o.fmt = function (v) { return String(v); };
    load(); showBest();

    $("intro").addEventListener("pointerdown", function (e) { e.preventDefault(); e.stopPropagation(); $("intro").hidden = true; audio(); o.start(e); });

  function bad() { tone(140, 0.3, 0.14, "sawtooth"); buzz(60); flash(); }

  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

<title>Schon gesehen?</title>
<style>
/* Schon gesehen?: Ein Symbol nach dem anderen. War es in diesem Lauf schon einmal da? NEU oder GESEHEN tippen.
   3 Leben, Punkte = richtige Antworten. Ab dem 2. Symbol ist mit 45 % Wahrscheinlichkeit eines dabei, das schon gezeigt wurde. */
:root { --acc: #9b8cff; }
#card { position: absolute; left: 50%; top: 34%; width: min(56vw, 240px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 14%; background: var(--panel);
  display: flex; align-items: center; justify-content: center; font-size: min(30vw, 130px); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
#card.pop { animation: pop 0.22s ease-out; }
#card.ok { box-shadow: 0 0 0 5px #4be08a; } #card.no { box-shadow: 0 0 0 5px #ff5068; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.2; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
#info { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font-size: 15px; height: 20px; letter-spacing: 0.05em; }
.btns { position: absolute; left: 6vw; right: 6vw; bottom: 6%; display: flex; gap: 4vw; }
.btns button { flex: 1; height: min(24vw, 104px); border: 0; border-radius: 18px; font-size: min(6vw, 24px); cursor: pointer; }
#b-new { background: #2f6bd8; } #b-seen { background: var(--acc); color: #0c0c12; }
.btns button:active { filter: brightness(1.2); }
.btns button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<script>
(function () {
  var POOL = "🐶 🐱 🐭 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦆 🦉 🐴 🦄 🐝 🦋 🐌 🐞 🐢 🐍 🐙 🦀 🐠 🐬 🐳 🐊 🦒 🐘 🦔 🌵 🌲 🌴 🍀 🍁 🍄 🌻 🌹 🌙 ⭐ ☀️ ⛄ 🔥 🌈 ☂️ 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🍒 🍍 🥝 🥕 🌽 🍞 🧀 🍔 🍕 🌭 🍟 🍩 🍪 🎂 🍫 🍭 ☕ ⚽ 🏀 🏈 🎾 🎱 🏓 🥊 🎯 🎲 🎸 🎺 🥁 🎧 🎨 🚗 🚕 🚌 🚑 🚒 🚜 🚲 ✈️ 🚀 ⛵ ⚓ 🏠 ⛺ 💡 🔑 🔨 ✂️ 📷 ⏰ 📚 ✏️ 🎈 🎁 👑 💎 🧲 🔔 🕶️ 👟 🧦 🎩".split(" ");
  var P_SEEN = 0.45, LIVES = 3;
  var G = Kit.$("game"), unused, seen, cur, curSeen, lives, score, state;
  G.innerHTML = '<div id="card" aria-live="polite"></div><div id="info"></div><div class="btns"><button id="b-new" type="button">NEU</button><button id="b-seen" type="button">GESEHEN</button></div>';
  var card = Kit.$("card"), info = Kit.$("info");
  function next() {
    var takeSeen = seen.length > 0 && (unused.length === 0 || Math.random() < P_SEEN);
    if (takeSeen) {
      var c; do { c = Kit.pick(seen); } while (seen.length > 1 && c === cur);
      cur = c; curSeen = true;
    } else { cur = unused.pop(); curSeen = false; }
    card.textContent = cur; card.className = ""; void card.offsetWidth; card.className = "pop"; info.textContent = "";
    state = "play";
  }
  function answer(saysSeen) {
    if (state !== "play") return;
    state = "wait";
    var ok = saysSeen === curSeen;
    if (!curSeen) seen.push(cur);
    if (ok) { score++; Kit.score(score); Kit.good(); Kit.buzz(6); card.classList.add("ok"); Kit.later(next, 230); }
    else {
      lives--; Kit.lives(lives, LIVES); Kit.bad(); card.classList.add("no");
      info.textContent = curSeen ? "Das war schon da." : "Das war neu.";
      if (lives <= 0) Kit.over(score, seen.length + " verschiedene Symbole gesehen.", 1100); else Kit.later(next, 900);
    }
  }

  bind("b-new", false); bind("b-seen", true);
  Kit.init({
    key: "e-gesehen-best", intro: "War das Symbol in diesem\nLauf schon einmal da?",
    reset: function () { unused = Kit.shuffle(POOL.slice()); seen = []; cur = null; lives = LIVES; score = 0; state = "idle"; card.textContent = ""; card.className = ""; info.textContent = ""; },
    start: function () { Kit.lives(lives, LIVES); next(); }
  });
  window.__g = { get s() { return { state: state, curSeen: curSeen, score: score, lives: lives }; }, answer: answer };
})();
</script>

<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>
