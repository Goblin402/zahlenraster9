<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tischtennis Nachtlicht</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--tx:#2c2c2a;--tx2:#5f5e5a;--bd:rgba(0,0,0,.15);--ac:#185FA5}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#262624;--tx:#f1efe8;--tx2:#b4b2a9;--bd:rgba(255,255,255,.18);--ac:#85B7EB}}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;max-width:600px}
button{font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.on{border:2px solid var(--ac)}
canvas{width:100%;max-width:600px;height:320px;touch-action:none;background:var(--card);border-radius:12px;display:block}
p{font-size:13px;color:var(--tx2);max-width:600px}
</style>
</head>
<body>
<div class="g">
<button id="b3">3D-Ansicht</button><button id="bt">Vogelperspektive</button>
<button id="bs">Von der Seite</button><button id="be">Vom Spielerplatz</button>
<button id="n1">1 Strahler</button><button id="n2">2 Strahler</button>
</div>
<canvas id="c"></canvas>
<p id="lx"></p>
<p>Ziehen zum Drehen. Strahler 2,5 m hoch, je 1,7 m seitlich der Plattenmitte.</p>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H=320,S;
function size(){var d=window.devicePixelRatio||1;W=c.clientWidth;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);S=Math.min(W/6.4,80);}
size();addEventListener('resize',size);
var yaw=.6,pitch=.45,N=1,t=0,tc=getComputedStyle(document.documentElement).getPropertyValue('--tx2');
function P(a,b,z){var X=a*Math.cos(yaw)-z*Math.sin(yaw),Z=a*Math.sin(yaw)+z*Math.cos(yaw),Y=b*Math.cos(pitch)-Z*Math.sin(pitch);return[W/2+X*S,H/2-(Y-1)*S+(pitch>1?0:30)];}
function L(p,q,col,w,dash,off){x.beginPath();x.setLineDash(dash||[]);x.lineDashOffset=off||0;x.strokeStyle=col;x.lineWidth=w||1;var a=P.apply(0,p),b=P.apply(0,q);x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);}
function poly(pts,fill,st){x.beginPath();pts.forEach(function(p,i){var a=P.apply(0,p);i?x.lineTo(a[0],a[1]):x.moveTo(a[0],a[1]);});x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(st){x.strokeStyle=st;x.lineWidth=1;x.stroke();}}
function T(s,p,dy){var a=P.apply(0,p);x.fillStyle=tc;x.font='12px sans-serif';x.textAlign='center';x.fillText(s,a[0],a[1]+(dy||0));}
function draw(){x.clearRect(0,0,W,H);
var hx=1.37,hz=.7625,h=.76,zs=N==1?[1.7]:[-1.7,1.7],pu=.5+.5*Math.sin(t*3),top=[[-hx,h,-hz],[hx,h,-hz],[hx,h,hz],[-hx,h,hz]];
poly([[-3,0,-2.2],[3,0,-2.2],[3,0,2.2],[-3,0,2.2]],null,'rgba(136,135,128,.4)');
zs.forEach(function(z){var hd=[0,2.35,z*.9];top.forEach(function(q){L(hd,q,'rgba(239,159,39,'+(.5+.4*pu)+')',1.2,[4,4],-t*30);});});
top.forEach(function(q){L([q[0],0,q[2]],q,'#888780',2);});
poly(top,'rgba(55,138,221,.45)','#185FA5');
poly(top,'rgba(250,199,117,'+((N==1?.22:.42)+.08*pu)+')');
L([0,h,-hz],[0,h,hz],'rgba(255,255,255,.8)',1);
poly([[0,h,-.9],[0,h,.9],[0,h+.15,.9],[0,h+.15,-.9]],'rgba(120,120,120,.35)','#5F5E5A');
zs.forEach(function(z){L([0,0,z],[0,2.5,z],'#5F5E5A',2.5);L([0,2.5,z],[0,2.35,z*.9],'#BA7517',7);L([-.5,0,z],[.5,0,z],'#5F5E5A',2);L([0,0,z-.3],[0,0,z+.3],'#5F5E5A',2);
var a=P(0,2.35,z*.9);x.beginPath();x.arc(a[0],a[1],6+5*pu,0,6.3);x.fillStyle='rgba(250,199,117,'+(.25+.25*pu)+')';x.fill();T('Strahler',[0,2.55,z],-6);});
[-2.4,2.4].forEach(function(px){L([px,0,0],[px,1.2,0],'#0F6E56',4);var a=P(px,1.4,0);x.beginPath();x.arc(a[0],a[1],8,0,6.3);x.fillStyle='#1D9E75';x.fill();T('Spieler',[px,1.55,0],-8);});
T('Platte',[0,h,0],4);}
function loop(){t+=.016;draw();requestAnimationFrame(loop);}
function info(){document.getElementById('lx').textContent='Grobe Schätzung: +'+(N*100)+' Lux auf der Platte (zusätzlich zum Laternenlicht). Ziel fürs Training: ca. 300 Lux.';
document.getElementById('n1').className=N==1?'on':'';document.getElementById('n2').className=N==2?'on':'';}
function v(a,b){yaw=a;pitch=b;}
b3.onclick=function(){v(.6,.45)};bt.onclick=function(){v(0,1.5708)};bs.onclick=function(){v(0,0)};be.onclick=function(){v(1.5708,0)};
n1.onclick=function(){N=1;info()};n2.onclick=function(){N=2;info()};
var dn=0,lx,ly;
c.onpointerdown=function(e){dn=1;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId);};
c.onpointermove=function(e){if(!dn)return;yaw+=(e.clientX-lx)*.01;pitch=Math.max(0,Math.min(1.5708,pitch+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY;};
c.onpointerup=function(){dn=0;};
info();loop();
</script>
</body>
</html>
