<script>
/* Zoomen verhindern: Pinch-Gesten (Safari), Zwei-Finger-Bewegungen und Doppeltipp */
(function () {
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - last < 350 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    last = now;
  }, { passive: false });
})();
</script>
<style>html, body, body * { touch-action: none !important; overscroll-behavior: none; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<title>Lane Rush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap">
<style>
/* Lane Rush: 3 Spuren, Autos ausweichen. Tippen links/rechts oder wischen = Spurwechsel.
   Gemessen: Tempo ~13,5 m/s + 1 m/s pro Sekunde, Spurwechsel ~0,3 s, Punkte = Meter. */
:root { --font: "Syne", "Arial Black", system-ui, sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: #17131f; color: #fff; font-family: var(--font); font-weight: 800; position: relative; overflow: hidden;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.bar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; z-index: 6; }
.bar button, .best { background: rgba(10, 4, 22, 0.6); color: #fff4e6; border: 0; border-radius: 999px; padding: 0.5em 0.95em; font: inherit; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.best b { opacity: 0.6; margin-right: 0.35em; }
.bar button { cursor: pointer; }
.bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.result { position: absolute; inset: 0; z-index: 7; background: rgba(8, 4, 16, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.result[hidden], .rec[hidden] { display: none; }
.lbl { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
.pts { font-size: min(13vw, 56px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.rec { color: #ffd34d; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.result button { margin-top: 10px; background: #1f7a62; color: #fff; border: 2px solid #3fd6b0; border-radius: 12px; padding: 0.65em 1.6em; font: inherit; font-size: 17px; cursor: pointer; }
.result button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
<canvas id="cv"></canvas>
<div class="bar">
  <button id="reset" type="button">&#8635; Reset</button>
  <div class="best" id="best"><b>Best</b>--</div>
</div>
<div class="result" id="result" hidden>
  <div class="lbl">Dein Ergebnis</div>
  <div class="pts" id="pts">0 Pts</div>
  <div class="rec" id="rec" hidden>Neuer Rekord</div>
  <button id="ok" type="button">&#10003; OKAY</button>
</div>
<script>
(function () {
  // Aus der Aufnahme gemessen (Meterzähler): Strecke d(t) = 13,0 t + 0,475 t², also Start 13,0 m/s, +0,95 m/s pro Sekunde.
  // Gegenverkehr: von der Kuppe bis zum Spieler ~0,55 s (bei 17 m/s) bis ~0,40 s (bei 32 m/s); Autos tauchen hinter der Kuppe auf.
  // Abstand zwischen den Reihen (Ankunft am Spieler): ~1,5 s am Anfang, ~0,7 s bei 450 m; erste Reihe bei ~65 m.
  // Zweierreihen erst ab ~280 m, etwa jede vierte Reihe. Spurwechsel 0,22 s. Spurabstand am Spieler 190/585 Bildbreite,
  // Kuppe bei 66 % Höhe, Spieler-Unterkante bei 89 %, Spurabstand an der Kuppe ~0,4x so groß wie am Spieler.
  var V0 = 13.0, ACC = 0.95, VMAX = 60, LANE_T = 0.22, LANE_W = 3, ZP = 7, ZC = 18, ZS = 24, ZFAR = 30;
  var FIRST_M = 65, PAIR_FROM = 280, PAIR_P = 0.25, CAMH = 5.0, Z1 = 7.6, DASH_P = 7, DASH_L = 2.6;
  function approach(v) { return (ZC - ZP) / 21.4 * (v + 20.8); }
  function rowGap(v) { return Math.max(0.5, 2.55 - 0.057 * v) * (0.88 + Math.random() * 0.24); }
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var Ws, Hs, dpr, f, yv, cx, HH, yCrest;
  function layout() {
    dpr = Math.min(3, window.devicePixelRatio || 1); Ws = window.innerWidth; Hs = window.innerHeight;
    cv.width = Math.round(Ws * dpr); cv.height = Math.round(Hs * dpr);

  }
  window.addEventListener("resize", layout); layout();
  function sm(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function hAt(z) { if (z <= Z1) return 0; if (z <= ZC) return HH * sm((z - Z1) / (ZC - Z1)); return HH - (z - ZC) * 0.55; }
  function P(x, y, z) { return [cx + f * x / z, yv + f * (CAMH - y) / z]; }

  var state = "idle", dist = 0, t = 0, v = V0, lane = 1, from = 1, lt = 1, obs = [], gen = 0, crashT = 0, best = 0, lastFree = [0, 1, 2], road = 0;
  var spin = null;
  try { best = parseInt(localStorage.getItem("lanerush-best"), 10) || 0; } catch (e) {}
  var bestEl = document.getElementById("best");
  function showBest() { bestEl.innerHTML = "<b>Best</b>" + (best ? best : "--"); }
  showBest();
  var COLORS = ["#d4553f", "#e58a2e", "#e9dcc0", "#3fa36a", "#9a5bc0", "#d9c34a"];
  function laneX(l) { return (l - 1) * LANE_W; }
  function laneP() { var p = Math.min(1, lt / LANE_T); return p * p * (3 - 2 * p); }
  function playerX() { return laneX(from) + (laneX(lane) - laneX(from)) * laneP(); }

  var spawnIn = 0, lastGap = 9;

    var two = dist >= PAIR_FROM && Math.random() < PAIR_P, blocked, gapT = lastGap;
    for (var tries = 0; tries < 20; tries++) {
      if (two) { var free = Math.floor(Math.random() * 3); blocked = [0, 1, 2].filter(function (l) { return l !== free; }); }
      else blocked = [Math.floor(Math.random() * 3)];
      var freeL = [0, 1, 2].filter(function (l) { return blocked.indexOf(l) < 0; });
      var ok = freeL.some(function (l) { return lastFree.some(function (m) { return m === l || (Math.abs(m - l) === 1 && gapT > 0.35) || (Math.abs(m - l) === 2 && gapT > 0.6); }); });
      if (ok) break;
    }
    blocked.forEach(function (l) {
      var van = Math.random() < 0.3;
      obs.push({ l: l, z: z, van: van, len: van ? 5.0 : 3.9, w: van ? 2.6 : 2.5, h: van ? 2.5 : 1.75,
        col: van ? ["#e9dcc0", "#d4553f", "#3fa36a"][Math.floor(Math.random() * 3)] : COLORS[Math.floor(Math.random() * COLORS.length)] });
    });
    lastFree = [0, 1, 2].filter(function (l) { return blocked.indexOf(l) < 0; });
  }
  function reset() {
    gen++; state = "idle"; dist = 0; t = 0; v = V0; lane = from = 1; lt = 1; obs = []; lastFree = [0, 1, 2]; spin = null;
    document.getElementById("result").hidden = true;
    var tA = (-V0 + Math.sqrt(V0 * V0 + 2 * ACC * FIRST_M)) / ACC, vA = V0 + ACC * tA;
    spawnIn = tA - (ZS - ZP) / approach(vA); lastGap = 9;
  }
  function crash(o) {
    state = "crash"; crashT = 0;
    var px = playerX(), side = px === laneX(o.l) ? (Math.random() < 0.5 ? -1 : 1) : (px < laneX(o.l) ? -1 : 1);
    spin = { x: px, z: ZP, dir: side, ang: 0, w: 7.5 * side };
    var sc = Math.floor(dist), rec = sc > best;
    if (rec) { best = sc; try { localStorage.setItem("lanerush-best", String(best)); } catch (e) {} showBest(); }
    document.getElementById("rec").hidden = !rec;
    document.getElementById("pts").textContent = sc + " Pts";
    var g = gen; setTimeout(function () { if (g === gen) { state = "done"; document.getElementById("result").hidden = false; } }, 1600);
  }
  function step(dt) {

    var d = v * dt; dist += d; lt += dt;
    road += (ZC - ZP) / 21.4 * v * dt;
    var u = approach(v) * dt;
    obs.forEach(function (o) { o.z -= u; });
    spawnIn -= dt;
    if (spawnIn <= 0) { spawnRow(ZS); var g = rowGap(v); lastGap = g; spawnIn += g; }
    var px = playerX();
    for (var i = 0; i < obs.length; i++) {
      var o = obs[i];
      if (o.z < ZP + PLAYER.len - 0.6 && o.z + o.len > ZP + 0.3 && Math.abs(px - laneX(o.l)) < (o.w + PLAYER.w) / 2 - 0.35) { crash(o); return; }
    }
    obs = obs.filter(function (o) { return o.z + o.len > 1.5; });
  }

  // ---------- Zeichnen (Maler-Algorithmus: hinten nach vorne, die Kuppe verdeckt dahinterliegende Autos) ----------
  function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }

    var A = P(x1, yf, zf), B = P(x2, yf, zf), C = P(x2, yf + h, zf), D = P(x1, yf + h, zf);
    var E = P(x1, yb, zb), F = P(x2, yb, zb), G = P(x2, yb + h, zb), Hh = P(x1, yb + h, zb);

    if (x2 < 0) poly([B, C, G, F], shade(col, 0.66));

    return [A, B, C, D];
  }
  function vehicle(x, z, o, facing) {
    var yf = hAt(z), yb = hAt(z + o.len), w = o.w, l = o.len, h = o.h;
    var s = P(x, yf, z), s2 = P(x + w / 2, yf, z), rw = Math.abs(s2[0] - s[0]);
    ctx.fillStyle = "rgba(20,8,10,0.28)"; ctx.beginPath(); ctx.ellipse(s[0], s[1] - rw * 0.05, rw * 1.08, rw * 0.16, 0, 0, 7); ctx.fill();
    // Räder
    var wh = 0.55;
    box(x - w * 0.42, z + 0.35, w * 0.16, l - 0.7, wh, "#1c1416", yf, yb);
    box(x + w * 0.42, z + 0.35, w * 0.16, l - 0.7, wh, "#1c1416", yf, yb);
    var bodyH = o.van ? h * 0.42 : h * 0.5, base = 0.28;
    var front = box(x, z, w * 0.94, l, bodyH, o.col, yf + base, yb + base);
    // Kabine
    var cabCol = o.van ? "#efe6d2" : o.col;
    var cz = o.van ? z + 0.2 : z + l * 0.28, cl = o.van ? l - 0.4 : l * 0.46;
    var cf = box(x, cz, w * (o.van ? 0.9 : 0.78), cl, h - bodyH - base, cabCol, yf + base + bodyH, yb + base + bodyH);
    // Scheibe
    var A = cf[0], B = cf[1], C = cf[2], D = cf[3], iw = 0.12, ih = 0.2;
    function lerp(p, q, k) { return [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]; }
    var a1 = lerp(lerp(A, B, iw), lerp(D, C, iw), ih), b1 = lerp(lerp(A, B, 1 - iw), lerp(D, C, 1 - iw), ih), c1 = lerp(lerp(A, B, 1 - iw), lerp(D, C, 1 - iw), 0.82), d1 = lerp(lerp(A, B, iw), lerp(D, C, iw), 0.82);
    poly([a1, b1, c1, d1], "#2b2f3a");
    // Lichter
    var lA = front[0], lB = front[1], lC = front[2], lD = front[3];
    var r = Math.max(1.4, rw * 0.09), ly = 0.5;
    var p1 = lerp(lerp(lA, lB, 0.17), lerp(lD, lC, 0.17), ly), p2 = lerp(lerp(lA, lB, 0.83), lerp(lD, lC, 0.83), ly);
    ctx.fillStyle = facing ? "#fff1b8" : "#ff6a4a"; ctx.beginPath(); ctx.arc(p1[0], p1[1], r, 0, 7); ctx.arc(p2[0], p2[1], r, 0, 7); ctx.fill();
  }
  var PLAYER = { w: 2.55, len: 3.9, h: 1.8, col: "#2f6fd0", van: false };
  var STRIPS = (function () { var z = [], a = 0.8; while (a < ZFAR) { var dz = a < 10 ? 0.35 : a < 20 ? 0.22 : 0.3; z.push([a, Math.min(ZFAR, a + dz)]); a += dz; } return z; })();
  function sky() {
    var g = ctx.createLinearGradient(0, 0, 0, Hs * 0.68);
    g.addColorStop(0, "#3d2a73"); g.addColorStop(0.55, "#7a4a9a"); g.addColorStop(1, "#d77a88");
    ctx.fillStyle = g; ctx.fillRect(0, 0, Ws, Hs);

    var sx = Ws * 0.78, sy = Hs * 0.47, sr = Ws * 0.06;
    ctx.fillStyle = "#ffd9a0"; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    // Wolken (driften langsam)
    var drift = (performance.now() / 1000 * 4) % (Ws * 1.4);
    [[0.18, 0.4, 0.9], [0.55, 0.36, 1.15], [0.86, 0.42, 0.8]].forEach(function (c) {
      var x = ((c[0] * Ws + drift * c[2]) % (Ws * 1.3)) - Ws * 0.15, y = Hs * c[1], s2 = Ws * 0.1 * c[2];
      ctx.fillStyle = "rgba(255,226,214,0.75)"; ctx.beginPath();
      ctx.arc(x - s2 * 0.45, y, s2 * 0.28, 0, 7); ctx.arc(x, y - s2 * 0.12, s2 * 0.4, 0, 7); ctx.arc(x + s2 * 0.45, y + s2 * 0.02, s2 * 0.26, 0, 7); ctx.fill();
    });
    // Dünenketten am Horizont
    var base = Hs * 0.668;
    function dunes(amp, yTop, ph, col) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, base);
      for (var i = 0; i <= 24; i++) { var x = Ws * i / 24; ctx.lineTo(x, yTop + amp * (0.5 + 0.5 * Math.sin(i * 0.9 + ph)) ); }
      ctx.lineTo(Ws, base); ctx.closePath(); ctx.fill();
    }

    dunes(Hs * 0.022, Hs * 0.63, 2.1, "#c27a7e");
  }
  var ZS_SAMPLES = (function () { var z = [], a = 0.8; while (a < ZC) { z.push(a); a += a < 10 ? 0.25 : 0.15; } z.push(ZC); return z; })();
  function band(x0, x1, col) {
    var pts = [];
    ZS_SAMPLES.forEach(function (z) { pts.push(P(x0, hAt(z), z)); });
    for (var i = ZS_SAMPLES.length - 1; i >= 0; i--) { var z = ZS_SAMPLES[i]; pts.push(P(x1, hAt(z), z)); }

  }
  function ground() {
    var yc = P(0, hAt(ZC), ZC)[1];
    ctx.fillStyle = "#d9a85e"; ctx.fillRect(0, yc, Ws, Hs - yc);
    var RW = 1.5 * LANE_W + 0.4;
    band(-RW - 0.28, RW + 0.28, "#f1ece4");
    band(-RW, RW, "#33282b");
    // Mittelstreifen
    var start = -((road % DASH_P) + DASH_P) % DASH_P;
    for (var z = start; z < ZC; z += DASH_P) {
      var z0 = Math.max(0.8, z), z1 = Math.min(ZC, z + DASH_L);
      if (z1 <= z0) continue;
      [-0.5, 0.5].forEach(function (k) {
        var x = k * LANE_W, dw = 0.16, pts = [], n = 6, i;
        for (i = 0; i <= n; i++) { var zz = z0 + (z1 - z0) * i / n; pts.push(P(x - dw, hAt(zz), zz)); }
        for (i = n; i >= 0; i--) { var zz2 = z0 + (z1 - z0) * i / n; pts.push(P(x + dw, hAt(zz2), zz2)); }
        poly(pts, "#ecd08a");
      });
    }
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sky();
    ground();
    var yc = P(0, hAt(ZC), ZC)[1];
    var list = obs.slice().sort(function (a, b) { return b.z - a.z; }), pDone = false;

      if (!pDone && o.z < ZP) { drawPlayer(); pDone = true; }

    });

    var red = (state === "crash" || state === "done") && crashT < 0.45;
    ctx.textBaseline = "alphabetic";
    var num = String(Math.floor(dist)), fs = Math.round(Ws * 0.15), fs2 = Math.round(Ws * 0.055);
    ctx.font = "800 " + fs + "px " + font; var w1 = ctx.measureText(num).width;
    ctx.font = "800 " + fs2 + "px " + font; var w2 = ctx.measureText("M").width;
    var x0 = Ws / 2 - (w1 + w2 + 6) / 2;
    ctx.textAlign = "left";
    ctx.font = "800 " + fs + "px " + font; ctx.fillStyle = "rgba(60,30,70,0.55)"; ctx.fillText(num, x0, my + 4);
    ctx.fillStyle = state === "idle" ? "rgba(255,248,236,0.55)" : "#fff6e6"; ctx.fillText(num, x0, my);
    ctx.font = "800 " + fs2 + "px " + font; ctx.fillStyle = "rgba(60,30,70,0.55)"; ctx.fillText("M", x0 + w1 + 6, my + 3);
    ctx.fillStyle = state === "idle" ? "rgba(255,248,236,0.55)" : "#fff6e6"; ctx.fillText("M", x0 + w1 + 6, my);
    if (state === "crash" || state === "done") {

      if (a > 0) { ctx.fillStyle = "rgba(225,40,50," + a + ")"; ctx.fillRect(0, 0, Ws, Hs); }
    }
  }
  function drawPlayer() {
    var x = playerX(), ang = 0, dx = 0, dy = 0;
    if (spin) {

      dy = -Math.sin(Math.min(1, tt / 0.5) * Math.PI) * Hs * 0.03;

      ang = Math.sin(Math.PI * Math.min(1, lt / LANE_T)) * 0.26 * (lane > from ? 1 : -1);

    ctx.save(); ctx.translate(c[0] + dx, c[1] + dy); ctx.rotate(ang); ctx.translate(-c[0], -c[1]);

  }
  function move(dir) {
    var target = Math.max(0, Math.min(2, lane + dir));
    if (target === lane) return;

  var down = null;
  function ui(e) { return e.target.closest && (e.target.closest(".bar") || e.target.closest(".result") || e.target.closest("#trx")); }
  document.addEventListener("pointerdown", function (e) {
    if (ui(e)) return; e.preventDefault();

    if (first) state = "run";
    if (state !== "run") return;
    down = { id: e.pointerId, x: e.clientX, done: first };
  });
  document.addEventListener("pointermove", function (e) {
    if (!down || down.id !== e.pointerId || down.done) return;
    var dx = e.clientX - down.x;
    if (Math.abs(dx) > 28) { down.done = true; move(dx > 0 ? 1 : -1); }
  });
  document.addEventListener("pointerup", function (e) {
    if (!down || down.id !== e.pointerId) return;
    if (!down.done && state === "run") move(e.clientX < Ws / 2 ? -1 : 1);
    down = null;
  });
  function bindTap(el, fn) { el.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); fn(); }); }
  bindTap(document.getElementById("reset"), reset);
  bindTap(document.getElementById("ok"), reset);
  reset();
  requestAnimationFrame(function (tm) { last = tm; frame(tm); });
  window.__lr = { get s() { return { state: state, dist: dist, v: v, lane: lane, obs: obs }; }, move: move, start: function () { state = "run"; } };
})();
</script>

#trx p{margin:0;max-width:340px;opacity:.8;line-height:1.35}

</style>
<div id="trx" hidden role="dialog" aria-modal="true" aria-labelledby="trx-h">
  <h2 id="trx-h">Highscores übertragen</h2>
  <p>Kopiere den Code und füge ihn in der Trainer-App unter „Highscores übertragen“ ein.</p>
  <textarea id="trx-code" readonly aria-label="Übertragungscode"></textarea>
  <div class="row"><button class="main" id="trx-copy" type="button">Kopieren</button><button id="trx-close" type="button">Schließen</button></div>
</div>
<script>
/* Highscores übertragen: "Best" lange drücken (0,6 s) zeigt einen Code mit allen gespeicherten Werten dieser App. */
(function () {
  var best = document.getElementById("best"), box = document.getElementById("trx");
  if (!best || !box) return;
  var code = document.getElementById("trx-code"), copyBtn = document.getElementById("trx-copy"), timer = 0;
  function makeCode() {
    var data = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); } } catch (e) {}
    return "TR1:" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function show() { code.value = makeCode(); copyBtn.textContent = "Kopieren"; box.hidden = false; }
  best.addEventListener("pointerdown", function () { clearTimeout(timer); timer = setTimeout(show, 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { best.addEventListener(t, function () { clearTimeout(timer); }); });
  ["pointerdown", "pointerup", "click", "touchstart", "touchend"].forEach(function (t) {
    box.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "Kopiert ✓"; }
    try { navigator.clipboard.writeText(code.value).then(done, function () { code.select(); document.execCommand("copy"); done(); }); }
    catch (e) { code.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
  });
  document.getElementById("trx-close").addEventListener("click", function () { box.hidden = true; });
})();
</script>
